<style>
/* ============ NANUM SQUARE NEO (fonts-archive CDN — VERIFIED working) ============ */
@import url('https://cdn.jsdelivr.net/gh/fonts-archive/NanumSquareNeo/NanumSquareNeo.css');
*{font-family:'Nanum Square Neo','Nanum Square Neo','Pretendard Variable',system-ui,-apple-system,sans-serif !important}
:root{
  /* Aichi-Nagoya 2026 official palette */
  --green-darkest:#1a1410;   /* dark warm base */
  --green-deep:#322d2a;       /* brand dark (site #322d2a) */
  --green:#d2372f;            /* brand red (site #d2372f) */
  --green-bright:#d5b200;     /* signature gold/mustard (site #d5b200) */
  --gold:#d5b200;             /* signature gold */
  --gold-bright:#FFEC8D;      /* pale cream-yellow (site #FFEC8D) */
  --gold-deep:#a6783e;        /* bronze tone (site #a6783e) */
  --sand:#f3ecdb;
  --cream:#f7f2e6;
  --ink:#322d2a;
  --ink-soft:#4a3f37;
  --mute:rgba(247,242,230,.6);
  --mute-strong:rgba(247,242,230,.82);
  --line:rgba(247,242,230,.16);
  --accent-red:#BF0D0D;       /* deep red (site #BF0D0D) */
  /* multi-color accents (Asian Games rainbow) */
  --purple:#4e3a93;
  --teal:#19aea9;
  --teal-bright:#4cc0bc;
  --green-asia:#07993F;
  --orange:#e87e20;
  --coral:#FE6152;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--cream);font-family:'Nanum Square Neo','Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif;font-feature-settings:"ss01","tnum";-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}

/* ============ PASSWORD GATE ============ */
/* ===== Appendix 상품 카탈로그 (카테고리 사이드바, 월드컵 포맷) ===== */
.slide.s-cat{display:grid;grid-template-columns:31% 1fr;background:var(--cream);color:var(--ink)}
.s-cat .side{background:#1a1410;color:#fff;padding:3cqw 2.2cqw;display:flex;flex-direction:column}
.s-cat .side .brand{font-size:1cqw;font-weight:800;color:rgba(255,255,255,.5);line-height:1.4;letter-spacing:.02em}
.s-cat .side .brand b{display:block;color:#fff;font-size:1.22cqw;font-weight:900;margin-top:.25cqw;letter-spacing:-.01em}
.s-cat .side .cat-head{margin:2.2cqw -2.2cqw 0;padding:1.2cqw 2.2cqw;background:var(--accent-red);color:#fff;font-size:2.2cqw;font-weight:900;letter-spacing:.02em}
.s-cat .side .plist{display:flex;flex-direction:column;gap:.9cqw;margin-top:1.8cqw}
.s-cat .side .plist .pi{padding:1.15cqw 1.3cqw;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:1.32cqw;font-weight:700;color:rgba(255,255,255,.55);line-height:1.3}
.s-cat .side .plist .pi.on{background:linear-gradient(120deg,rgba(191,13,13,.4),rgba(191,13,13,.16));border-color:rgba(210,55,47,.7);color:#fff;font-weight:800}
.s-cat .side .allbtn{margin-top:auto;text-align:center;padding:1cqw;border:1px solid rgba(255,255,255,.35);border-radius:10px;font-size:1.12cqw;font-weight:800;color:#fff;letter-spacing:.04em;text-decoration:none}
.s-cat .main{padding:3.2cqw 3.2cqw 2.2cqw;display:flex;flex-direction:column;position:relative;min-height:0;overflow:hidden;background:var(--cream)}
.s-cat .main h2{font-size:2.5cqw;font-weight:900;line-height:1.22;letter-spacing:-.02em}
.s-cat .main h2 em{font-style:normal;color:var(--accent-red)}
.s-cat .main .desc{margin-top:1cqw;font-size:1.32cqw;color:rgba(11,20,16,.62);line-height:1.6;max-width:54cqw}
.s-cat .main .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:1.6cqw 0 .6cqw;overflow:hidden}
.s-cat .stage.twin2{gap:1.4cqw}
.s-cat .stage.twin2 .tw{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9cqw;min-width:0}
.s-cat .stage.twin2 .tw .shot{max-height:84%;max-width:100%}
.s-cat .stage.twin2 .cap{font-size:1.05cqw;font-weight:800;color:var(--accent-red);letter-spacing:.01em;white-space:nowrap}
.s-cat .stage.twin2 .arrow{font-size:2.6cqw;font-weight:900;color:rgba(11,20,16,.28);flex-shrink:0}
.s-cat .shot{max-height:100%;max-width:90%;height:auto;width:auto;border-radius:1.6cqw;box-shadow:0 2.4cqw 4cqw -1.4cqw rgba(0,0,0,.45);display:block}
.s-cat .ph-box{display:none;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;width:16cqw;height:30cqw;border-radius:1.6cqw;background:repeating-linear-gradient(45deg,#f3ecdb,#f3ecdb 10px,#ede4c9 10px,#ede4c9 20px);color:rgba(11,20,16,.55);text-align:center;padding:1cqw}
.s-cat .ph-box .ph-tag{font-size:.9cqw;font-weight:800;letter-spacing:.16em;color:#d2372f;padding:.3cqw .8cqw;background:#fff;border-radius:99px;border:1px solid rgba(210,55,47,.3)}
.s-cat .ph-box .ph-path{font-size:.85cqw;font-family:monospace;color:rgba(11,20,16,.7);word-break:break-all}
.s-cat .ph-box .ph-hint{font-size:.8cqw;color:rgba(11,20,16,.45)}
.s-cat .main .note{font-size:.86cqw;color:rgba(11,20,16,.45)}
.apply-float{position:fixed;top:18px;right:22px;z-index:9998;display:inline-flex;align-items:center;gap:8px;padding:12px 22px;background:var(--accent-red);color:#fff;font-weight:800;font-size:15px;border-radius:99px;text-decoration:none;box-shadow:0 12px 28px -8px rgba(191,13,13,.6);letter-spacing:.01em;font-family:'Nanum Square Neo','Pretendard Variable',sans-serif}
.apply-float:hover{filter:brightness(1.08);transform:translateY(-1px)}
body.presenting .apply-float{display:none}
.gate{position:fixed;inset:0;z-index:9999;background:radial-gradient(80% 100% at 50% 100%,rgba(210,55,47,.18) 0%,transparent 60%),linear-gradient(180deg,#1a1410 0%,#322d2a 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif}
.gate.hidden{display:none}
#lockBtn{display:none}
.gate-box{width:min(92vw,460px);padding:48px 44px;background:rgba(255,255,255,.04);border:1px solid rgba(213,178,0,.25);border-radius:16px;backdrop-filter:blur(20px);text-align:center;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.gate-naver{margin:0 auto 28px;display:flex;justify-content:center}
.gate-naver img{width:130px;height:auto;display:block;max-height:32px;object-fit:contain}
.gate-box h1{font-size:24px;font-weight:900;letter-spacing:-.01em;line-height:1.25;margin-bottom:10px}
.gate-box h1 em{font-style:normal;color:#FFEC8D}
.gate-box .sub{font-size:13px;color:rgba(255,255,255,.55);letter-spacing:.04em;margin-bottom:32px;line-height:1.6}
.gate-form{display:flex;gap:8px;flex-direction:column}
.gate-form input{padding:14px 18px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.16);border-radius:10px;color:#fff;font-size:15px;font-family:inherit;outline:none;transition:.2s;letter-spacing:.04em}
.gate-form input:focus{border-color:#d5b200;background:rgba(0,0,0,.55)}
.gate-form button{padding:14px;background:linear-gradient(135deg,#d5b200,#a6783e);color:#1a1410;font-size:14px;font-weight:900;letter-spacing:.06em;border:none;border-radius:10px;cursor:pointer;transition:.2s;text-transform:uppercase}
.gate-form button:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(213,178,0,.3)}
.gate-err{margin-top:14px;font-size:12px;color:#ff7373;min-height:16px;letter-spacing:.02em}
.gate-foot{margin-top:24px;font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.3);text-transform:uppercase}

/* ---------- deck shell ---------- */
.deck{display:flex;flex-direction:column;align-items:center;gap:24px;padding:32px 0 96px}
.slide{
  position:relative;width:min(96vw,1600px);aspect-ratio:16/9;
  background:var(--ink);border-radius:14px;overflow:hidden;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);
  isolation:isolate;
  container-type:inline-size;
  container-name:slide;
}
.slide .pageno{display:none}
.slide .topbar{position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#d2372f 0%,#d5b200 50%,#4e3a93 100%);z-index:6;opacity:.8}

/* Brand mark visible ONLY on cover (s1) and closing (s18) */
.slide .brand-mark{display:none}
#s18 .brand-mark{display:inline-flex}

/* ---------- NAVER brand mark (Wikipedia commons logotype) ---------- */
.brand-mark{position:absolute;left:30px;top:22px;z-index:7;display:inline-flex;align-items:center;gap:10px;transition:opacity .2s}
.brand-mark .nv-logo{display:inline-block;width:72px;height:18px}
.brand-mark .nv-logo img{display:block;width:100%;height:100%;object-fit:contain}
.brand-mark .tag{display:none}
@keyframes nv-pulse{0%{box-shadow:0 0 0 0 rgba(3,199,90,.5)}70%{box-shadow:0 0 0 10px rgba(3,199,90,0)}100%{box-shadow:0 0 0 0 rgba(3,199,90,0)}}

/* ---------- universal animations ---------- */
@keyframes float-slow{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes float-fast{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin-slow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes drift{0%{transform:translateX(-100%)}100%{transform:translateX(100vw)}}
@keyframes drop-petal{0%{transform:translate(0,-20vh) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(40px,110vh) rotate(540deg);opacity:0}}
@keyframes sun-pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.05);opacity:1}}
@keyframes torch-flicker{0%,100%{transform:translateY(0) scale(1);filter:brightness(1)}50%{transform:translateY(-2px) scale(1.05);filter:brightness(1.2)}}
@keyframes shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes track-dash{to{stroke-dashoffset:-40}}
@keyframes ring-grow{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes count-flash{0%{color:#fff}50%{color:var(--gold-bright)}100%{color:#fff}}
@keyframes runner-run{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@keyframes ripple{0%{transform:scale(.8);opacity:.6}100%{transform:scale(2.4);opacity:0}}

/* ---------- Aichi-Nagoya 2026 Official Emblem ---------- */
.aichi-emblem{display:block;width:100%;height:100%}
.aichi-emblem .crescent{transition:transform .6s cubic-bezier(.2,.7,.2,1);animation:crescent-breathe 6s ease-in-out infinite;transform-origin:250px 280px;transform-box:view-box}
.aichi-emblem .crescent.cr-y{animation-delay:.6s}
.aichi-emblem .crescent.cr-g{animation-delay:1.2s;transform-origin:250px 420px}
.aichi-emblem:hover .crescent.cr-p{animation:none;transform:translate(-8px,-4px) rotate(-3deg)}
.aichi-emblem:hover .crescent.cr-y{animation:none;transform:translate(8px,-4px) rotate(3deg)}
.aichi-emblem:hover .crescent.cr-g{animation:none;transform:translateY(6px) scale(1.05)}
@keyframes crescent-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes oca-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes oca-beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

.emblem-side{position:absolute;left:17%;top:50%;transform:translateY(-50%);width:29%;max-width:360px;aspect-ratio:5/6;z-index:2;pointer-events:auto;display:flex;align-items:center;justify-content:center}
.cover-img-wrap{position:relative;width:100%;height:100%;border-radius:18px;overflow:hidden}
.aichi-logo{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;z-index:2;filter:drop-shadow(0 24px 50px rgba(0,0,0,.55));transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.aichi-logo:hover{transform:scale(1.04)}
.cover-img-wrap:not(.no-img) .cover-ph-fallback{display:none}
.cover-ph-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.04),rgba(255,255,255,.04) 12px,rgba(255,255,255,.08) 12px,rgba(255,255,255,.08) 24px);border:1px dashed rgba(213,178,0,.35);border-radius:18px;color:rgba(247,242,230,.7);text-align:center;padding:24px;z-index:1}
.cover-ph-fallback .ph-tag{font-size:12px;font-weight:800;letter-spacing:.22em;color:#FFEC8D;padding:5px 14px;background:rgba(213,178,0,.15);border-radius:99px;border:1px solid rgba(213,178,0,.4)}
.cover-ph-fallback .ph-path{font-size:14px;font-family:'JetBrains Mono','SF Mono',monospace;color:rgba(247,242,230,.92);line-height:1.5;font-weight:700}
.cover-ph-fallback .ph-hint{font-size:11px;color:rgba(247,242,230,.5);line-height:1.5;margin-top:4px}
.emblem-side .aichi-emblem text{font-family:'Nanum Square Neo','Pretendard Variable','Inter',sans-serif}

/* small OCA sun stamp for accents */
.oca-stamp{display:inline-block;width:64px;height:64px;pointer-events:none}
.oca-stamp svg{width:100%;height:100%;display:block}
.oca-stamp .oca-sun{transform-origin:center;transform-box:fill-box;animation:oca-spin 50s linear infinite}
.oca-stamp.corner{position:absolute;right:80px;top:80px;z-index:3}

/* mouse-follow spotlight on dark slides */
.spotlight{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(213,178,0,.06) 0%,transparent 70%);pointer-events:none;transform:translate(-50%,-50%);z-index:0;mix-blend-mode:screen;transition:opacity .3s;opacity:0}
.slide:hover .spotlight{opacity:1}

/* ---------- cherry blossoms (subtle, drift across) ---------- */
.sakura{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.sakura .petal{position:absolute;top:-10%;width:8px;height:8px;background:radial-gradient(circle at 35% 30%,#fff0f5 0%,#ffc8d8 55%,#f3a4be 100%);border-radius:50% 0 50% 50%;opacity:.5;animation:drop-petal 18s linear infinite;filter:blur(.3px)}
.sakura .petal:nth-child(1){left:14%;animation-delay:0s;animation-duration:20s}
.sakura .petal:nth-child(2){left:32%;animation-delay:4s;animation-duration:17s;transform:scale(.7)}
.sakura .petal:nth-child(3){left:58%;animation-delay:8s;animation-duration:22s;transform:scale(1.1)}
.sakura .petal:nth-child(4){left:74%;animation-delay:2s;animation-duration:19s;transform:scale(.85)}
.sakura .petal:nth-child(5){left:88%;animation-delay:11s;animation-duration:21s;transform:scale(.75)}
.sakura .petal:nth-child(6){left:46%;animation-delay:14s;animation-duration:23s;transform:scale(1)}

/* ---------- interactive: hover & focus ---------- */
.s4 .card,.s6 .stat,.s13 .pk,.s16 .sp{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,filter .35s}
.s4 .card:hover,.s16 .sp:hover{transform:translateY(-6px);box-shadow:0 18px 40px -16px rgba(0,0,0,.35)}
.s6 .stat:hover{transform:translateY(-4px) scale(1.02);z-index:3;box-shadow:0 22px 40px -18px rgba(210,55,47,.4)}
.s13 .pk:hover{transform:translateY(-8px);box-shadow:0 26px 50px -20px rgba(213,178,0,.4);filter:brightness(1.04)}
.s13 .pk:nth-child(1){animation:gold-shimmer 5s ease-in-out infinite}
@keyframes gold-shimmer{0%,100%{box-shadow:0 0 0 0 rgba(213,178,0,0)}50%{box-shadow:0 0 30px 0 rgba(213,178,0,.35)}}

/* sports floating gallery */
.sport-float{position:absolute;pointer-events:none;z-index:1;display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1;filter:grayscale(.2)}
.sport-float svg{display:block;width:100%;height:100%}
.sport-float.f1{animation:float-slow 6s ease-in-out infinite}
.sport-float.f2{animation:float-slow 7s ease-in-out infinite reverse}
.sport-float.f3{animation:float-fast 5s ease-in-out infinite}
.sport-float.f4{animation:float-slow 8s ease-in-out infinite}
.sport-float.f5{animation:float-fast 6s ease-in-out infinite reverse}

/* running track dashed motif */
.track-motif{position:absolute;left:0;right:0;bottom:0;height:60px;pointer-events:none;opacity:.18;z-index:1}
.track-motif svg{width:100%;height:100%}
.track-motif .lane{stroke:var(--gold);stroke-width:1.5;fill:none;stroke-dasharray:8 6;animation:track-dash 1.4s linear infinite}

/* live indicator */
.live-dot{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;background:var(--accent-red);color:#fff;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.12em}
.live-dot::before{content:"";width:6px;height:6px;background:#fff;border-radius:50%;animation:nv-pulse 1.2s infinite}

/* medal icon for package tiers */
.medal-ico{display:inline-flex;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;font-size:18px;font-weight:900;position:relative;flex:0 0 36px}
.medal-ico::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);width:14px;height:18px;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);margin-top:-4px}
.medal-gold{background:radial-gradient(circle at 30% 30%,#f5d568,#c8941b);color:#5a3e08;box-shadow:0 0 12px rgba(213,178,0,.5),inset 0 -3px 4px rgba(0,0,0,.2)}
.medal-gold::after{background:linear-gradient(180deg,#d2372f,#8a1a14)}
.medal-silver{background:radial-gradient(circle at 30% 30%,#e8edf2,#8a939a);color:#3a3f44;box-shadow:0 0 10px rgba(232,237,242,.4),inset 0 -3px 4px rgba(0,0,0,.2)}
.medal-silver::after{background:linear-gradient(180deg,#4e3a93,#2a1f5a)}
.medal-bronze{background:radial-gradient(circle at 30% 30%,#e3a772,#7a3f1a);color:#3f1e08;box-shadow:0 0 10px rgba(167,99,46,.4),inset 0 -3px 4px rgba(0,0,0,.2)}
.medal-bronze::after{background:linear-gradient(180deg,#0a6b3d,#063018)}
.medal-finalist{background:radial-gradient(circle at 30% 30%,#ff8077,#8a1a14);color:#fff;box-shadow:0 0 10px rgba(210,55,47,.4),inset 0 -3px 4px rgba(0,0,0,.2)}
.medal-finalist::after{background:linear-gradient(180deg,#19aea9,#0a5957)}
.medal-opener{background:radial-gradient(circle at 30% 30%,#8e7cd8,#3a2a78);color:#fff;box-shadow:0 0 10px rgba(78,58,147,.4),inset 0 -3px 4px rgba(0,0,0,.2)}
.medal-opener::after{background:linear-gradient(180deg,#e87e20,#a64e08)}

/* torch */
.torch{position:absolute;width:54px;height:90px;display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:2}
.torch .flame{width:30px;height:42px;background:radial-gradient(ellipse at 50% 80%,#ffd24a 0%,#ff7a1a 40%,#d2372f 70%,transparent 100%);border-radius:50% 50% 30% 30%;animation:torch-flicker 1.6s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(255,122,26,.6))}
.torch .handle{width:6px;flex:1;background:linear-gradient(180deg,#a6783e,#5a3f20);border-radius:3px;margin-top:-4px}

/* ---------- Image placeholders for mockups ---------- */
.mock-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:3;border-radius:inherit}
.ph-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:repeating-linear-gradient(45deg,#f3ecdb,#f3ecdb 10px,#ede4c9 10px,#ede4c9 20px);color:rgba(11,20,16,.55);font-family:'Nanum Square Neo','Pretendard Variable',sans-serif;text-align:center;padding:12px;z-index:2;border-radius:inherit}
.ph-fallback .ph-tag{font-size:10px;font-weight:800;letter-spacing:.16em;color:#d2372f;padding:3px 9px;background:#fff;border-radius:99px;border:1px solid rgba(210,55,47,.3)}
.ph-fallback .ph-path{font-size:10px;font-family:'JetBrains Mono','SF Mono',monospace;color:rgba(11,20,16,.7);line-height:1.4;word-break:break-all}
.ph-fallback .ph-hint{font-size:10px;color:rgba(11,20,16,.45);line-height:1.4;margin-top:4px}
.ph-fallback.small{padding:6px;gap:4px}
.ph-fallback.small .ph-tag{font-size:9px;padding:2px 6px}
.ph-fallback.small .ph-path{font-size:8px;line-height:1.3}

/* Strip inner padding/gap on mockup containers when image fills */
.phone .scr,.mini-phone .ms,.lap .scr,.mp .scr,.s7 .mock{position:relative !important;overflow:hidden}
.phone .scr,.mini-phone .ms,.lap .scr,.mp .scr{padding:0 !important;gap:0 !important;background:#0a0a0a !important}
.s7 .mock{padding:0 !important;gap:0 !important;background:#0a0a0a !important}

/* ---------- typography ---------- */
/* Hide all eyebrow labels except on chapter dividers (.s-div .eyebrow stays) */
.eyebrow{display:none}
.s-div .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.32em;color:var(--gold-bright);text-transform:uppercase;font-weight:700;justify-content:center}
.s-div .eyebrow::before,.s-div .eyebrow::after{content:"";width:28px;height:1px;background:var(--gold)}
.s2 .h-eyebrow{display:none}
h1.kicker{font-size:clamp(40px,5.8cqw,88px);line-height:1.02;font-weight:900;letter-spacing:-.02em}
h2.kicker{font-size:clamp(28px,3.55cqw,54px);line-height:1.08;font-weight:900;letter-spacing:-.018em}
h3.kicker{font-size:clamp(20px,2.08cqw,30px);line-height:1.18;font-weight:800;letter-spacing:-.012em}
.lead{font-size:clamp(15px,1.1cqw,18px);line-height:1.55;color:var(--mute-strong)}
.gold{color:var(--gold-bright)}
.green{color:var(--green-bright)}
.red{color:#ff7373}

/* ---------- shared bg motifs ---------- */
.diag-light{background:linear-gradient(110deg,var(--ink) 0%,var(--ink) 48%,var(--cream) 48.2%,var(--cream) 100%)}
.diag-dark{background:linear-gradient(110deg,var(--green-darkest) 0%,var(--green-deep) 48%,#0a1410 48.2%,#0a1410 100%)}
.cream-bg{background:var(--cream);color:var(--ink)}
.deep-bg{background:radial-gradient(120% 80% at 80% -10%,#3a2820 0%,transparent 60%),var(--ink)}

/* ---------- big number bg shadow ---------- */
.bignum-ghost{font-family:'Nanum Square Neo','Pretendard Variable',sans-serif;font-weight:900;font-size:clamp(120px,18.75cqw,260px);line-height:.85;color:rgba(255,255,255,.04);letter-spacing:-.04em;position:absolute;pointer-events:none}

/* ---------- SLIDE 1 ---------- */
.s1{background:radial-gradient(80% 100% at 50% 110%,#d2372f33 0%,transparent 60%),linear-gradient(180deg,#1a1410 0%,#1a1410 50%,#28201c 100%)}
.s1::before{content:"";position:absolute;inset:0;background:
  radial-gradient(2px 2px at 18% 22%,rgba(232,196,106,.6),transparent 60%),
  radial-gradient(2px 2px at 78% 18%,rgba(232,196,106,.5),transparent 60%),
  radial-gradient(1.5px 1.5px at 30% 70%,rgba(232,196,106,.4),transparent 60%),
  radial-gradient(1.5px 1.5px at 70% 80%,rgba(232,196,106,.45),transparent 60%);
  z-index:1}
.s1 .frame{position:absolute;inset:34px;border:1px solid rgba(232,196,106,.25);border-radius:6px;z-index:1}
.s1 .frame::before,.s1 .frame::after{content:"";position:absolute;width:24px;height:24px;border:2px solid var(--gold-bright)}
.s1 .frame::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.s1 .frame::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.s1 .corner-tr,.s1 .corner-bl{position:absolute;width:24px;height:24px;border:2px solid var(--gold-bright);z-index:2}
.s1 .corner-tr{top:32px;right:32px;border-left:none;border-bottom:none}
.s1 .corner-bl{bottom:32px;left:32px;border-right:none;border-top:none}
.s1 .nav{position:absolute;top:48px;right:64px;display:flex;align-items:center;gap:12px;z-index:5}
.s1 .nav .logo{display:inline-block;width:96px;height:22px}
.s1 .nav .logo img{display:block;width:100%;height:100%;object-fit:contain}
.s1 .brand-mark{display:none}
.s1 .nav .divider{width:1px;height:18px;background:rgba(255,255,255,.2)}
.s1 .nav .tag{font-size:11px;letter-spacing:.3em;color:var(--mute);text-transform:uppercase}
.s1 .center{position:absolute;right:5%;top:50%;transform:translateY(-50%);width:48%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;z-index:4;text-align:left}
.s1 .badge{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border:1px solid rgba(232,196,106,.4);border-radius:99px;color:var(--gold-bright);font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:700;margin-bottom:28px}
.s1 .badge .dot{width:6px;height:6px;background:var(--gold-bright);border-radius:50%;box-shadow:0 0 12px var(--gold-bright)}
.s1 h1{font-size:4.25cqw;line-height:1.14;font-weight:900;letter-spacing:-.025em;color:#fff;margin-bottom:18px;font-family:'Nanum Square Neo','Pretendard Variable','Inter',sans-serif}
.s1 h1 .big{display:block}
.s1 h1 .big:first-child{color:#fff;opacity:.92}
.s1 h1 .big:last-child{background:linear-gradient(135deg,#FFEC8D 0%,#d5b200 50%,#a6783e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:4px;padding-bottom:.1em}
.s1 .strap{display:inline-flex;align-items:center;gap:14px;padding:10px 22px;background:rgba(210,55,47,.18);border:1px solid rgba(213,178,0,.35);border-radius:99px;order:-1;margin:0 0 22px}
.s1 .strap b{font-size:14px;letter-spacing:.05em;color:#fff;font-weight:800}
.s1 .strap .vs{font-size:12px;color:var(--gold-bright);letter-spacing:.2em}
.s1 .strap .lit{color:var(--green-bright)}
.s1 .meta{position:absolute;bottom:40px;left:0;right:0;display:flex;justify-content:center;gap:48px;color:var(--mute);font-size:11px;letter-spacing:.16em;text-transform:uppercase;z-index:3}
.s1 .meta b{color:#fff;letter-spacing:.06em}
.s1 .contact-block{margin-top:28px;display:flex;flex-direction:column;gap:8px;padding:18px 20px;background:rgba(255,255,255,.04);border:1px solid rgba(213,178,0,.2);border-radius:10px;backdrop-filter:blur(8px)}
.s1 .contact-block .cb-row{display:flex;gap:14px;font-size:12px;line-height:1.4}
.s1 .contact-block .cb-k{flex:0 0 64px;color:var(--gold-bright);font-weight:700;letter-spacing:.04em}
.s1 .contact-block .cb-v{flex:1;color:rgba(255,255,255,.85);font-weight:500}
#s18 .brand-mark{left:auto;right:30px;top:auto;bottom:30px}
#s18 .pageno{display:none}

/* ---------- SLIDE 2 (대회 정보) ---------- */
.s2{background:var(--cream);color:var(--ink);display:grid;grid-template-columns:1.05fr .95fr;gap:0}
.s2 .left{padding:64px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.s2 .left::after{content:"";position:absolute;right:0;top:8%;bottom:8%;width:1px;background:rgba(11,20,16,.1)}
.s2 .right{background:var(--green-darkest);color:var(--cream);padding:64px 56px;position:relative;overflow:hidden}
.s2 .right::before{content:"2026";position:absolute;right:-30px;bottom:-90px;font-size:340px;font-weight:900;letter-spacing:-.06em;color:rgba(213,178,0,.07)}
.s2 .h-eyebrow{display:flex;align-items:center;gap:14px;color:var(--green);font-size:13px;letter-spacing:.22em;font-weight:800;text-transform:uppercase}
.s2 .h-eyebrow::before{content:"";width:32px;height:2px;background:var(--green)}
.s2 h2{font-size:3.4cqw;font-weight:900;line-height:1.05;letter-spacing:-.02em;margin-top:1.13cqw;color:var(--ink)}
.s2 h2 em{font-style:normal;color:var(--green);background:linear-gradient(180deg,transparent 65%,rgba(213,178,0,.18) 65%,rgba(213,178,0,.18) 92%,transparent 92%);padding:0 4px}
.s2 .info-list{list-style:none;margin-top:36px}
.s2 .info-list li{display:flex;gap:18px;align-items:flex-start;padding:14px 0;border-bottom:1px dashed rgba(11,20,16,.12);font-size:16px}
.s2 .info-list li:last-child{border-bottom:none}
.s2 .info-list .k{flex:0 0 130px;color:var(--green);font-weight:800;letter-spacing:.02em}
.s2 .info-list .v{color:var(--ink);font-weight:500}
.s2 .info-list .v b{font-weight:800;color:#322d2a}
.s2 .foot{font-size:11px;color:rgba(11,20,16,.5);letter-spacing:.02em}
.s2 .right h3{margin-top:2.06cqw;font-size:1.5cqw;font-weight:800;color:var(--gold-bright);letter-spacing:-.01em}
.s2 .right .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.s2 .right .card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:18px 20px;backdrop-filter:blur(8px)}
.s2 .right .card.tz{background:linear-gradient(135deg,rgba(213,178,0,.24),rgba(210,55,47,.2));border:1px solid rgba(232,196,106,.7);box-shadow:0 0 26px rgba(213,178,0,.3)}
.s2 .right .card.tz .val{color:var(--gold-bright)}
.s2 .right .card.tz .label::after{content:" · 실시간 LIVE";color:#ff8a80;font-weight:900}
.s2 .right .card .label{font-size:11px;letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.s2 .right .card .val{margin-top:10px;font-weight:900;font-size:28px;color:#fff;line-height:1;letter-spacing:-.02em}
.s2 .right .card .val .unit{font-size:14px;color:var(--gold-bright);margin-left:4px;font-weight:700}
.s2 .right .card .note{margin-top:8px;font-size:11px;color:var(--mute)}
.s2 .right .belt{margin-top:28px;padding:20px;border-radius:10px;background:linear-gradient(135deg,rgba(200,162,74,.18),rgba(210,55,47,.18));border:1px solid rgba(232,196,106,.25)}
.s2 .right .belt .t{font-size:12px;letter-spacing:.2em;color:var(--gold-bright);font-weight:800}
.s2 .right .belt .d{margin-top:8px;font-size:15px;color:#fff;font-weight:600;line-height:1.4}

/* ---------- SLIDE 3 (왜 네이버) ---------- */
.s3{background:linear-gradient(110deg,#1a1410 0%,#1a1410 46%,#f3ecdb 46.2%,#f3ecdb 100%);color:#fff;position:relative}
.s3 .left{position:absolute;left:0;top:0;bottom:0;width:46%;padding:4cqw 3.5cqw;display:flex;flex-direction:column;justify-content:center}
.s3 .right{position:absolute;right:0;top:0;bottom:0;width:54%;padding:64px 56px;color:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:16px}
.s3 .eyebrow{color:var(--gold-bright)}
.s3 h2{font-size:2.875cqw;font-weight:900;line-height:1.05;margin-top:1.13cqw;letter-spacing:-.02em}
.s3 h2 em{font-style:normal;color:var(--gold-bright)}
.s3 .lead{margin-top:18px;color:var(--mute-strong)}
.s3 .pipe{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.s3 .pipe .node{display:flex;align-items:center;gap:14px;font-size:14px;color:rgba(247,242,230,.85)}
.s3 .pipe .node .pill{padding:6px 14px;border:1px solid rgba(232,196,106,.35);border-radius:99px;font-weight:700;color:var(--gold-bright);font-size:12px;letter-spacing:.1em}
.s3 .right{gap:12px}
.s3 .row{display:flex;gap:18px;align-items:flex-start;padding:18px 22px;background:#fff;border:1px solid rgba(11,20,16,.06);border-radius:12px;box-shadow:0 8px 20px -14px rgba(11,20,16,.18);transition:transform .25s,box-shadow .25s,border-color .25s;position:relative;overflow:hidden}
.s3 .row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#d2372f,#d5b200);opacity:0;transition:.25s}
.s3 .row:hover{transform:translateX(4px);box-shadow:0 14px 28px -16px rgba(210,55,47,.3);border-color:rgba(210,55,47,.2)}
.s3 .row:hover::before{opacity:1}
.s3 .row .num{font-size:28px;font-weight:900;color:var(--green);min-width:46px;line-height:1;letter-spacing:-.02em;background:linear-gradient(135deg,#d2372f,#a6783e);-webkit-background-clip:text;background-clip:text;color:transparent}
.s3 .row .body{flex:1}
.s3 .row .body h3{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.005em}
.s3 .row .body p{margin-top:6px;font-size:13px;color:rgba(11,20,16,.62);line-height:1.55}

/* ---------- SLIDE 4 (광고기회 가치) ---------- */
.s4{background:var(--cream);color:var(--ink);position:relative;overflow:hidden}
.s4::before{content:"";position:absolute;right:-180px;top:-180px;width:720px;height:720px;border-radius:50%;background:radial-gradient(circle,rgba(213,178,0,.22) 0%,transparent 60%)}
.s4 .top{padding:56px 64px 0}
.s4 h2{font-size:48px;font-weight:900;line-height:1.05;letter-spacing:-.02em}
.s4 h2 em{font-style:normal;background:linear-gradient(120deg,var(--green) 0%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.s4 .sub{margin-top:14px;color:rgba(11,20,16,.6);font-size:16px}
.s4 .grid{padding:36px 64px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.s4 .card{position:relative;padding:1.9cqw 1.5cqw;border-radius:14px;background:#fff;border:1px solid rgba(11,20,16,.07);box-shadow:0 12px 24px -16px rgba(11,20,16,.18);overflow:hidden}
.s4 .card.dark{background:var(--green-darkest);color:#fff;border-color:transparent}
.s4 .card.gold{background:linear-gradient(135deg,#c8a24a 0%,#8a6a1e 100%);color:#fff;border-color:transparent}
.s4 .card .ico{display:none}
.s4 .card h3{margin-top:1.1cqw;font-size:1.4cqw;font-weight:800;line-height:1.25;letter-spacing:-.005em}
.s4 .card p{margin-top:.7cqw;font-size:1cqw;line-height:1.55;color:rgba(11,20,16,.6)}
.s4 .card.dark p,.s4 .card.gold p{color:rgba(255,255,255,.78)}
.s4 .card .corner-tag{position:absolute;top:14px;right:14px;font-size:10px;letter-spacing:.16em;color:rgba(11,20,16,.4);font-weight:700;text-transform:uppercase}
.s4 .card.dark .corner-tag,.s4 .card.gold .corner-tag{color:rgba(255,255,255,.55)}
.s4 .strap{margin:30px 64px 0;padding:20px 28px;border-radius:12px;background:linear-gradient(120deg,var(--green-darkest) 0%,var(--green-deep) 100%);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:24px}
.s4 .strap .l{font-size:16px;font-weight:700;line-height:1.4}
.s4 .strap .r{font-size:13px;color:var(--gold-bright);letter-spacing:.04em;font-weight:600}

/* ---------- SLIDE 5 (경기 일정) ---------- */
.s5{background:radial-gradient(140% 90% at 100% 0%,rgba(210,55,47,.22) 0%,transparent 50%),var(--ink);color:#fff;position:relative;overflow:hidden}
.s5 .yr{position:absolute;right:-40px;top:-30px;font-size:280px;font-weight:900;letter-spacing:-.06em;color:rgba(232,196,106,.06);line-height:.85}
.s5 .top{padding:38px 56px 0;position:relative;z-index:2}
.s5 h2{font-size:clamp(28px,2.6cqw,38px);font-weight:900;line-height:1.05}
.s5 h2 em{font-style:normal;color:var(--gold-bright)}
.s5 .sub{color:var(--mute-strong);font-size:15px;margin-top:10px}
.s5 .sched{padding:18px 56px 0;display:flex;flex-direction:column;gap:10px;position:relative;z-index:2}
.s5 .ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.s5 .ev{display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center;padding:10px 14px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border:1px solid var(--line);border-left:3px solid var(--gold-bright);border-radius:8px;transition:.2s}
.s5 .ev:hover{transform:translateX(3px);border-left-color:#d2372f}
.s5 .ev.hl{border-left-color:#d2372f;background:linear-gradient(90deg,rgba(210,55,47,.12),rgba(255,255,255,.02))}
.s5 .ev-d{display:flex;flex-direction:column;line-height:1}
.s5 .ev-d .ev-m{font-size:18px;font-weight:900;color:#fff;letter-spacing:-.01em}
.s5 .ev-d .ev-dow{font-size:10px;color:var(--gold-bright);font-weight:700;letter-spacing:.06em;margin-top:3px}
.s5 .ev-body{min-width:0}
.s5 .ev-title{font-size:13px;font-weight:800;color:#fff;letter-spacing:-.005em;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s5 .ev-title em{font-style:normal;font-size:10px;font-weight:500;color:var(--mute);margin-left:4px;letter-spacing:.02em}
.s5 .ev-place{margin-top:2px;font-size:10.5px;color:var(--mute);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s5 .ev-tag{flex-shrink:0;font-size:9px;font-weight:800;letter-spacing:.04em;padding:4px 8px;border-radius:99px;white-space:nowrap}
.s5 .ev-tag.g{background:rgba(213,178,0,.18);color:#FFEC8D;border:1px solid rgba(213,178,0,.4)}
.s5 .ev-tag.r{background:rgba(210,55,47,.2);color:#ff8077;border:1px solid rgba(210,55,47,.45)}
.s5 .ev-tag.p{background:rgba(78,58,147,.2);color:#a89eda;border:1px solid rgba(78,58,147,.45)}
.s5 .ev-tag.op{background:rgba(255,255,255,.08);color:var(--mute-strong);border:1px solid rgba(255,255,255,.15)}
.s5 .sec-label{font-size:12px;letter-spacing:.22em;color:var(--gold-bright);font-weight:800;text-transform:uppercase}
.s5 .sec-label::before{content:"";display:inline-block;width:18px;height:1px;background:var(--gold);margin-right:10px;vertical-align:middle}
.s5 .match{display:grid;grid-template-columns:120px 1.4fr 60px 1.4fr 1fr;gap:24px;align-items:center;padding:18px 22px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border:1px solid var(--line);border-left:3px solid var(--gold-bright);border-radius:10px}
.s5 .match .date{display:flex;flex-direction:column}
.s5 .match .date .m{font-size:11px;letter-spacing:.2em;color:var(--gold-bright);font-weight:700}
.s5 .match .date .d{font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1;margin-top:2px;color:#fff}
.s5 .match .date .t{font-size:11px;color:var(--mute);letter-spacing:.1em;margin-top:6px}
.s5 .match .team{font-size:22px;font-weight:800;letter-spacing:-.01em;color:#fff}
.s5 .match .team .en{display:block;font-size:11px;color:var(--mute);font-weight:500;letter-spacing:.08em;margin-top:2px}
.s5 .match .vs{font-size:13px;letter-spacing:.3em;color:var(--gold-bright);font-weight:800;text-align:center}
.s5 .match.away .team{text-align:left}
.s5 .match .venue{text-align:right}
.s5 .match .venue .stage{display:inline-block;padding:4px 10px;background:rgba(232,196,106,.12);color:var(--gold-bright);font-size:11px;font-weight:700;letter-spacing:.06em;border-radius:99px}
.s5 .match .venue .place{display:block;margin-top:8px;font-size:11px;color:var(--mute)}
.s5 .timeline{margin:14px 56px 0;padding:14px 18px;border:1px solid var(--line);border-radius:10px;position:relative;z-index:2}
.s5 .timeline .tl{display:grid;grid-template-columns:repeat(5,1fr);position:relative;margin-top:14px}
.s5 .timeline .tl::before{content:"";position:absolute;left:10%;right:10%;top:13px;height:2px;background:linear-gradient(90deg,var(--green-bright),var(--gold-bright),var(--accent-red))}
.s5 .timeline .stop{text-align:center;position:relative;padding-top:34px}
.s5 .timeline .stop::before{content:"";position:absolute;left:50%;margin-left:-6px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--gold-bright);box-shadow:0 0 0 4px rgba(232,196,106,.18)}
.s5 .timeline .stop .lab{font-size:12px;color:var(--mute);letter-spacing:.04em}
.s5 .timeline .stop .ct{font-size:16px;font-weight:900;color:#fff;letter-spacing:-.01em;margin-top:2px}
.s5 .timeline .stop .ct .x{font-size:13px;color:var(--gold-bright);margin-left:4px;font-weight:700}
.s5 .timeline .stop .dt{margin-top:6px;font-size:11px;color:var(--mute);letter-spacing:.02em}
.s5 .timeline .h{font-size:13px;letter-spacing:.2em;color:var(--gold-bright);font-weight:800;text-transform:uppercase}
.s5 .foot-note{position:absolute;left:64px;bottom:8px;font-size:11px;color:var(--mute);letter-spacing:.04em}

/* ---------- SLIDE 6 (성과 KPI 그리드) ---------- */
.s6{background:var(--cream);color:var(--ink);position:relative;overflow:hidden}
.s6::before{content:"";position:absolute;left:-200px;bottom:-200px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(200,162,74,.18) 0%,transparent 60%)}
.s6 .top{padding:30px 64px 0;position:relative;z-index:2}
.s6 h2{font-size:38px;font-weight:900;line-height:1.05;letter-spacing:-.02em}
.s6 h2 em{font-style:normal;color:var(--green)}
.s6 h2 .gold{color:var(--gold)}
.s6 .sub{margin-top:12px;color:rgba(11,20,16,.6);font-size:15px}
.s6 .grid{position:relative;z-index:2;margin:16px 64px 0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:12px;height:72%}
.s6 .stat{position:relative;border-radius:14px;padding:13px 18px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.s6 .stat.g{background:var(--green-darkest);color:#fff}
.s6 .stat.gold{background:linear-gradient(135deg,#c8a24a 0%,#8a6a1e 100%);color:#fff}
.s6 .stat.w{background:#fff;color:var(--ink);border:1px solid rgba(11,20,16,.08)}
.s6 .stat .ghost{position:absolute;right:-20px;bottom:-40px;font-size:120px;font-weight:900;letter-spacing:-.04em;color:rgba(255,255,255,.08);line-height:.85}
.s6 .stat.w .ghost{color:rgba(11,20,16,.05)}

.s16 .sp.bbl .ico{background:rgba(232,196,106,.15);color:var(--gold-bright)}

.s16 .sp .name{font-size:2.05cqw;font-weight:900;letter-spacing:-.005em}

/* ---------- SLIDE 17 (유의사항) ---------- */
.s17{background:var(--cream);color:var(--ink);padding:3.4cqw 4.5cqw;display:flex;flex-direction:column;justify-content:flex-start;gap:.9cqw;overflow:hidden}

/* ---------- SLIDE 18 (E.O.D. — WorldCup deck final-page format) ---------- */
.s18{background:linear-gradient(180deg,#d2372f 0%,#a82926 100%);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6cqw 5cqw}

/* ---------- nav HUD ---------- */
.hud{position:fixed;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:20}
.hud a{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18);transition:.2s}
.hud a:hover{background:var(--gold-bright);transform:scale(1.4)}
.hud a.on{background:var(--gold-bright)}
.toolbar{position:fixed;left:18px;bottom:18px;display:flex;gap:8px;z-index:20}
.toolbar button{padding:8px 14px;background:rgba(0,0,0,.6);border:1px solid rgba(232,196,106,.3);color:var(--gold-bright);font-size:12px;font-weight:700;letter-spacing:.06em;border-radius:99px;cursor:pointer;backdrop-filter:blur(10px)}
.toolbar button:hover{background:rgba(232,196,106,.12)}
.toolbar button:disabled{opacity:.55;cursor:default}
#editBtn.on{background:linear-gradient(135deg,#d5b200,#a6783e);color:#1a1410;border-color:#d5b200}
/* secret edit controls: hidden unless unlocked via ?edit=<key> URL */
#editBtn,#exportBtn,#resetBtn{display:none}
body.edit-enabled #editBtn{display:inline-block}
body.edit-enabled.editing #exportBtn,body.edit-enabled.editing #resetBtn{display:inline-block}
body.presenting #editBtn,body.presenting #exportBtn,body.presenting #resetBtn{display:none !important}
/* 📌 수정요청(annotation) 모드 */
#annotBtn{display:none}
body.edit-enabled #annotBtn{display:inline-block}
body.presenting #annotBtn{display:none !important}
#annotBtn.on{background:#d2372f;color:#fff;border-color:#d2372f}
body.annotating .deck .slide *:hover{outline:2px dashed #d2372f;outline-offset:2px;cursor:crosshair}
.annot-pin{position:absolute;z-index:60;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#d2372f;color:#fff;font-size:13px;font-weight:800;line-height:24px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.45);pointer-events:none}
body:not(.annotating) .annot-pin{display:none}
.annot-panel{position:fixed;right:14px;bottom:64px;z-index:1000;background:rgba(20,16,12,.96);color:#f7f2e6;border:1px solid rgba(213,178,0,.45);border-radius:12px;padding:12px 14px;font-size:12px;max-width:360px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
body:not(.annotating) .annot-panel{display:none}
.annot-panel .ap-list{max-height:180px;overflow:auto;margin:8px 0;display:flex;flex-direction:column;gap:4px}
.annot-panel .ap-list .ap-item{padding:5px 8px;background:rgba(255,255,255,.06);border-radius:6px;line-height:1.35}
.annot-panel .ap-btns{display:flex;gap:6px;margin-top:6px}
.annot-panel .ap-btns button{flex:1;padding:7px 0;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#f7f2e6;font-weight:800;font-size:12px;cursor:pointer}
.annot-panel .ap-btns .ap-copy{background:#d5b200;color:#1a1410;border-color:#d5b200}

/* ---------- EDIT MODE ---------- */
.edit-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:9997;background:linear-gradient(90deg,#d5b200,#a6783e);color:#1a1410;font-size:13px;font-weight:800;letter-spacing:.02em;padding:9px 16px;align-items:center;justify-content:center;gap:14px;box-shadow:0 4px 16px rgba(0,0,0,.28)}
.edit-banner .hint{font-weight:600;opacity:.82;font-size:12px}
body.editing .edit-banner{display:flex}
body.presenting .edit-banner{display:none !important}
body.editing [contenteditable]{cursor:text;border-radius:3px;transition:background .12s,outline .12s}
body.editing [contenteditable]:hover{outline:1px dashed rgba(213,178,0,.75);outline-offset:2px;background:rgba(213,178,0,.07)}
body.editing [contenteditable]:focus{outline:2px solid #d5b200;outline-offset:2px;background:rgba(213,178,0,.12)}
body.editing .img-editable{cursor:pointer;position:relative}
body.editing .img-editable:hover{outline:2px dashed #d2372f;outline-offset:2px;border-radius:6px}
body.editing .img-editable:hover::after{content:'🖼 클릭해서 이미지 교체';position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#FFEC8D;font-size:11px;font-weight:700;padding:4px 11px;border-radius:99px;z-index:50;white-space:nowrap;pointer-events:none}
@media print{.edit-banner{display:none !important}[contenteditable]{outline:none !important;background:none !important}}

/* ===== AM slide builder (add / delete custom slides) ===== */
#addBtn{display:none}
body.edit-enabled.editing #addBtn{display:inline-block}
body.presenting #addBtn{display:none !important}

/* slide add palette */
.palette{position:fixed;inset:0;z-index:10000;background:rgba(10,10,10,.62);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.palette[hidden]{display:none}
.palette-box{background:#221d19;border:1px solid rgba(213,178,0,.3);border-radius:18px;padding:28px 30px;width:min(92vw,640px);box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
.palette-h{color:#FFEC8D;font-size:18px;font-weight:900;letter-spacing:.02em;margin-bottom:18px}
.palette-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.palette-item{display:block;text-align:left;background:#2c2620;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .15s,transform .12s}
.palette-item:hover{border-color:#d5b200;transform:translateY(-2px)}
.pi-prev{height:104px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;letter-spacing:.04em;margin-bottom:10px;overflow:hidden}
.pi-offer{background:radial-gradient(70% 70% at 50% 40%,rgba(210,55,47,.35),transparent),linear-gradient(135deg,#1a1410,#2a2018);color:#FFEC8D;font-size:15px}
.pi-offer span{color:#d5b200;font-size:20px}
.pi-blank{background:repeating-linear-gradient(45deg,#f3ecdb,#f3ecdb 12px,#ede4c9 12px,#ede4c9 24px);color:rgba(11,20,16,.55);font-size:13px}
.pi-pkg{background:linear-gradient(135deg,#3a2f12,#d5b200 280%);color:#1a1410;font-size:14px;font-weight:900}
.pi-pkg span{font-size:20px}
.pi-name{color:#fff;font-weight:800;font-size:14px}
.pi-desc{color:rgba(255,255,255,.55);font-size:11.5px;margin-top:3px}
.palette-cancel{margin-top:18px;width:100%;padding:11px;background:transparent;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.8);border-radius:99px;font-weight:700;cursor:pointer}
.palette-cancel:hover{background:rgba(255,255,255,.06)}

/* per-custom-slide controls (only while editing) */
.slide-ctrls{display:none}
body.editing .slide[data-custom] .slide-ctrls{display:flex;gap:6px;position:absolute;top:10px;right:10px;z-index:40}
.slide-ctrls button{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.62);color:#FFEC8D;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.slide-ctrls button:hover{background:rgba(210,55,47,.85);color:#fff}

/* ---------- print (16:9 full-bleed landscape, full color) ---------- */
@page{size:297mm 167.0625mm;margin:0}
@media print{
  html,body{background:#fff;margin:0;padding:0;width:297mm;height:167.0625mm;-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important}
  body{overflow:visible !important}
  .deck{gap:0;padding:0;margin:0;display:block;width:297mm}
  .hud,.toolbar,.gate,.present-counter,.apply-float{display:none !important}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important}
  .slide{
    width:297mm !important;
    height:167.0625mm !important;
    max-width:none !important;
    max-height:none !important;
    aspect-ratio:auto !important;
    page-break-after:always;
    page-break-inside:avoid;
    break-inside:avoid;
    border-radius:0 !important;
    box-shadow:none !important;
    margin:0 !important;
    transform:none !important;
    inset:auto !important;
    position:relative !important;
    overflow:hidden !important;
    container-type:inline-size !important;
  }
  .slide:last-child{page-break-after:auto}
  /* presentation-mode overrides shouldn't apply during print */
  body.presenting{overflow:visible !important}
  body.presenting .deck{position:static !important;display:block !important;inset:auto !important;width:297mm !important;height:auto !important}
  body.presenting .slide,
  body.presenting .slide.active{display:block !important;position:relative !important;left:auto !important;top:auto !important;inset:auto !important;transform:none !important;width:297mm !important;height:167.0625mm !important;aspect-ratio:auto !important}
}

/* ============ PRESENTATION MODE — 16:9 strict + flex-centered + scale ============ */
/* 슬라이드 내부 레이아웃 무결성 100% 유지. 16:9가 아닌 모니터에선 letterbox 발생 (의도된 동작) */
body.presenting{overflow:hidden;background:#000}
html:has(body.presenting){background:#000}
body.presenting .deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:0;gap:0;margin:0;width:100vw;height:100vh}
body.presenting .slide:not(.active){display:none}
body.presenting .slide.active{
  position:relative;
  left:auto;top:auto;
  width:1600px;height:900px;
  aspect-ratio:auto;
  flex:0 0 auto;
  border-radius:0;
  box-shadow:none;
  margin:0;
  transform:scale(min(100vw / 1600, 100vh / 900));
  transform-origin:center center;
  animation:p-fade .35s cubic-bezier(.2,.7,.2,1)
}
body.presenting .hud{display:none}
body.presenting .gate{display:none}
body.presenting .toolbar{position:fixed;bottom:14px;right:14px;left:auto;z-index:9999;opacity:.2;transition:opacity .3s}
body.presenting .toolbar:hover{opacity:1}
body.presenting .toolbar button{background:rgba(0,0,0,.7);font-size:11px;padding:6px 10px}
@keyframes p-fade{from{opacity:0}to{opacity:1}}
/* Slide counter overlay in presentation */
.present-counter{position:fixed;bottom:18px;left:18px;z-index:9998;color:rgba(255,255,255,.55);font-size:12px;font-weight:700;letter-spacing:.16em;font-family:'Nanum Square Neo',sans-serif;display:none;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:99px;backdrop-filter:blur(10px)}
body.presenting .present-counter{display:block}

const PW_CACHE='nag-pw';
const gate=document.getElementById('gate');
const gateForm=document.getElementById('gateForm');
const gatePw=document.getElementById('gatePw');
const gateErr=document.getElementById('gateErr');

const _te=new TextEncoder(), _td=new TextDecoder();
function _b64ToBuf(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function _bufToB64(buf){const u=new Uint8Array(buf);let s='';const CH=0x8000;for(let i=0;i<u.length;i+=CH){s+=String.fromCharCode.apply(null,u.subarray(i,Math.min(i+CH,u.length)));}return btoa(s);}
function _deriveKey(pw,salt){
  return crypto.subtle.importKey('raw',_te.encode(pw),'PBKDF2',false,['deriveKey'])
    .then(base=>crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']));
}
async function decryptDeck(pw){
  const key=await _deriveKey(pw,_b64ToBuf(ENC_SALT));
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:_b64ToBuf(ENC_IV)},key,_b64ToBuf(ENC_DATA));
  return _td.decode(plain);
}
async function encryptDeck(pw,text){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await _deriveKey(pw,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,_te.encode(text));
  return {salt:_bufToB64(salt),iv:_bufToB64(iv),data:_bufToB64(ct)};
}

let deckInited=false;
async function unlockWith(pw){
  if(!pw) return false;
  let plain;
  try{ plain=await decryptDeck(pw); }
  catch(e){ return false; }
  document.querySelector('.deck').innerHTML=plain;
  sessionStorage.setItem(PW_CACHE,pw);
  if(!deckInited){ initDeck(); deckInited=true; }
  gate.classList.add('hidden');
  return true;
}
function lockGate(){ sessionStorage.removeItem(PW_CACHE); location.reload(); }
gateForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const ok=await unlockWith(gatePw.value.trim());
  if(ok){ gateErr.textContent=''; }
  else{ gateErr.textContent='비밀번호가 일치하지 않습니다. 다시 확인해주세요.'; gatePw.value=''; gatePw.focus(); }
});
