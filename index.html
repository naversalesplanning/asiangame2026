  annotPanel.querySelector('.ap-copy').addEventListener('click',()=>{
    if(!annots.length){ alert('복사할 요청이 없습니다.'); return; }
    const txt='[아시안게임 덱 수정요청 '+annots.length+'건]\n'+annots.map((a,i)=>
      (i+1)+'. 슬라이드 #'+a.slide+' · 요소: '+a.path+(a.eid?' (eid:'+a.eid+')':'')+(a.text?' · 현재 텍스트: “'+a.text+'”':'')+'\n   → 요청: '+a.memo).join('\n');
    const done=()=>{ alert('복사 완료! Claude에게 그대로 붙여넣으면 됩니다.'); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(()=>{ window.prompt('아래 내용을 직접 복사하세요:',txt); });
    else window.prompt('아래 내용을 직접 복사하세요:',txt);
  });
  annotPanel.querySelector('.ap-clear').addEventListener('click',()=>{
    if(!annots.length) return;
    if(!confirm('수정요청 '+annots.length+'건을 모두 지울까요?')) return;
    annots=[]; annotSave(); annotRender();
  });
  annotRender();

  /* ---- export a deployable, ENCRYPTED index.html with edits baked in ---- */
  async function exportHTML(){
    if(editing) setEditing(false); // strip contenteditable + editing class from live DOM first
    const curPw=sessionStorage.getItem('nag-pw');
    if(!curPw){ alert('암호화 비밀번호를 찾을 수 없습니다.\n다시 비밀번호를 입력해 접속한 뒤 저장해주세요.'); return; }
    // 새 비밀번호로 저장할지 묻는다 (광고주별 덱 분리용). [취소]=저장 중단, 빈칸=기존 유지.
    const np=prompt('이 파일을 열 때 쓸 비밀번호를 정하세요.\n\n• 기존 비밀번호 그대로 → 빈칸으로 두고 [확인]\n• 광고주별로 분리 → 새 비밀번호 입력 후 [확인]\n\n⚠️ 비밀번호를 잊으면 이 파일을 다시 열 수 없습니다.','');
    if(np===null) return; // 취소 → 저장 안 함
    const pw=np.trim()?np.trim():curPw;
    const pwChanged=pw!==curPw;
    const exportBtn=document.getElementById('exportBtn');
    const prev=exportBtn?exportBtn.textContent:'';
    if(exportBtn){ exportBtn.disabled=true; exportBtn.textContent='암호화 중…'; }
    try{
      // 1) 현재 편집된 deck 마크업 정리 (편집 흔적 제거, 단 data-custom은 유지해 재편집 때 인식)
      const deckClone=deck.cloneNode(true);
      deckClone.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
      deckClone.querySelectorAll('.slide.active').forEach(e=>e.classList.remove('active'));
      deckClone.querySelectorAll('[data-eid]').forEach(e=>e.removeAttribute('data-eid'));
      deckClone.querySelectorAll('[data-ieid]').forEach(e=>e.removeAttribute('data-ieid'));
      deckClone.querySelectorAll('[data-scratch]').forEach(e=>e.removeAttribute('data-scratch'));
      deckClone.querySelectorAll('[data-wired]').forEach(e=>e.removeAttribute('data-wired'));
      deckClone.querySelectorAll('.slide-ctrls,.lock-badge,.insert-zone,.rowdel,.addrow-btn,.annot-pin').forEach(e=>e.remove());
      deckClone.querySelectorAll('.img-editable').forEach(e=>e.classList.remove('img-editable'));
      const deckHTML=deckClone.innerHTML;
      // 2) 암호화 (텍스트 + 교체 이미지 data URL까지 ciphertext 안으로)
      const enc=await encryptDeck(pw,deckHTML);
      // 3) 발행 문서 조립 — deck은 비우고 ENC 블록만 새 값으로 교체 (평문 절대 미포함)
      const clone=document.documentElement.cloneNode(true);
      const b=clone.querySelector('body'); if(b) b.classList.remove('editing','presenting','edit-enabled','annotating');
      clone.querySelectorAll('.annot-panel,.annot-pin').forEach(e=>e.remove());
      clone.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
      const cd=clone.querySelector('.deck'); if(cd) cd.innerHTML='';
      clone.querySelectorAll('input[type="file"]').forEach(e=>e.remove());               // drop hidden picker
      clone.querySelectorAll('script[src*="html2canvas"],script[src*="jspdf"]').forEach(e=>e.remove()); // drop lazy-loaded libs
      let html='<!doctype html>\n'+clone.outerHTML;
      const repl='/*ENC-START*/const ENC_SALT="'+enc.salt+'",ENC_IV="'+enc.iv+'",ENC_DATA="'+enc.data+'";/*ENC-END*/';
      html=html.replace(/\/\*ENC-START\*\/[\s\S]*?\/\*ENC-END\*\//, ()=>repl); // 함수 치환: base64의 $ 오해석 방지
      const blob=new Blob([html],{type:'text/html;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='index.html'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
      // 추가한 장표는 이제 파일에 구워졌으므로 스크래치 버퍼 정리 (재로드 시 중복 방지)
      deck.querySelectorAll('.slide[data-custom]').forEach(s=>delete s.dataset.scratch);
      localStorage.removeItem(CUSTOM_KEY);
      alert('수정완료. 편집 내용을 암호화한 index.html을 다운로드했습니다.\n\n🔑 이 파일의 비밀번호: '+pw+(pwChanged?'   ← 새 비밀번호로 변경됨!':'   (기존과 동일)')+'\n\n이 파일을 원하는 곳에 올리면(push/호스팅) 위 비밀번호로만 열립니다.\n소스 보기를 해도 단가/내용은 암호문으로만 보입니다.');
    }catch(err){
      alert('암호화 저장 중 문제가 발생했습니다.\n'+(err&&err.message?err.message:err));
    }finally{
      if(exportBtn){ exportBtn.disabled=false; exportBtn.textContent=prev; }
    }
  }
  document.getElementById('exportBtn').addEventListener('click',exportHTML);

  /* ========== ONE-CLICK PDF DOWNLOAD ========== */
  const pdfBtn=document.getElementById('pdfBtn');
  function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('스크립트 로드 실패: '+src)); document.head.appendChild(s); }); }
  let libsReady=false;
  async function ensureLibs(){
    if(libsReady) return;
    await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
    libsReady=true;
  }
  pdfBtn.addEventListener('click',async()=>{
    if(editing) setEditing(false);
    if(document.body.classList.contains('presenting') && typeof exitPresent==='function') exitPresent();
    const orig=pdfBtn.textContent; pdfBtn.disabled=true;
    try{
      pdfBtn.textContent='PDF 준비 중…';
      await ensureLibs();
      const jsPDF=window.jspdf.jsPDF;
      const all=[...document.querySelectorAll('.slide')];
      let pdf=null;
      for(let i=0;i<all.length;i++){
        pdfBtn.textContent='PDF 생성 중 '+(i+1)+'/'+all.length+'…';
        const canvas=await html2canvas(all[i],{
          scale:2, useCORS:true, backgroundColor:null, logging:false,
          width:1600, height:900, windowWidth:1600,
          onclone:(doc)=>{
            doc.querySelectorAll('.slide').forEach(s=>{ s.style.borderRadius='0'; s.style.boxShadow='none'; });
            doc.querySelectorAll('.annot-pin').forEach(e=>e.remove());
            // html2canvas can't render gradient text (background-clip:text) → force a solid fill so glyphs are visible
            const solidFill=(sel,color)=>doc.querySelectorAll(sel).forEach(e=>{
              e.style.background='none'; e.style.backgroundImage='none';
              e.style.webkitBackgroundClip='initial'; e.style.backgroundClip='initial';
              e.style.webkitTextFillColor=color; e.style.color=color;
            });
            solidFill('.s1 h1 .big:last-child, .s-div h1 em, .s14 .left .name, .s15 .left .name, .s16 h2 em', '#e6c46a');
            solidFill('.s3 .row .num, .s4 h2 em, .s14 .right h2 em', '#d2372f');
            solidFill('.pk-silver .left .name', '#a9a9a9');
            solidFill('.pk-bronze .left .name', '#b87333');
            solidFill('.pk-video .left .name', '#d2372f');
            solidFill('.pk-clip .left .name', '#6b6fae');
          }
        });
        const data=canvas.toDataURL('image/jpeg',0.92);
        const w=canvas.width, h=canvas.height;     // page size = exact canvas pixels → zero margin
        if(i===0) pdf=new jsPDF({orientation:'landscape',unit:'px',format:[w,h]});
        else pdf.addPage([w,h],'landscape');
        pdf.addImage(data,'JPEG',0,0,w,h);          // fill the entire page edge-to-edge
      }
      pdf.save('2026_AsianGames_AichiNagoya_NaverPremium.pdf');
    }catch(err){
      alert('PDF 생성 중 문제가 발생했습니다.\n'+(err&&err.message?err.message:err)+'\n\n대안: 키보드 Cmd+P(Mac) / Ctrl+P(Win) → "PDF로 저장"을 사용해 주세요.');
    }finally{
      pdfBtn.disabled=false; pdfBtn.textContent=orig;
    }
  });

  /* ========== SLIDE BUILDER INIT (palette + lock badges + custom slides) ========== */
  const addBtn=document.getElementById('addBtn');
  const palette=document.getElementById('palette');
  if(addBtn) addBtn.addEventListener('click',()=>{ if(editing && palette){ pendingInsertBefore=null; palette.hidden=false; } });
  if(palette){
    palette.querySelectorAll('.palette-item').forEach(b=>{
      b.addEventListener('click',()=>{
        palette.hidden=true;
        const ref=pendingInsertBefore;          // freeze target (multi-insert keeps order before same ref)
        b.dataset.tpl.split(',').forEach(t=>addCustomSlide(t.trim(), ref));
        pendingInsertBefore=null;
      });
    });
    const pc=document.getElementById('paletteCancel'); if(pc) pc.addEventListener('click',()=>palette.hidden=true);
    palette.addEventListener('click',e=>{ if(e.target===palette) palette.hidden=true; });
  }
  // AM mode: stamp a lock badge on every standard slide
  if(amMode){
    deck.querySelectorAll('.slide:not([data-custom])').forEach(s=>{
      if(!s.querySelector(':scope > .lock-badge')){
        const lb=document.createElement('div'); lb.className='lock-badge'; lb.textContent='🔒 표준 장표 — 수정 불가';
        s.appendChild(lb);
      }
    });
  }
  // enhance custom slides already baked into the deck, then restore scratch (unsaved) ones
  deck.querySelectorAll('.slide[data-custom]').forEach(enhanceCustomSlide);
  restoreCustom();
  rebuildHud();
})();

/* ====== Counter animation on KPI numbers ====== */
function getFirstTextNode(el){
  for(const n of el.childNodes){
    if(n.nodeType===Node.TEXT_NODE && n.textContent.trim()) return n;
  }
  return null;
}
function easeOutCubic(t){return 1-Math.pow(1-t,3)}
function animateNumberNode(textNode,raw){
  // Parse target value (handles 1.77, 2,830, 36.1, 191, 46, 1.5, 4,600 etc.)
  const cleaned=raw.replace(/,/g,'');
  const target=parseFloat(cleaned);
  if(isNaN(target)) return;
  const hasComma=/,/.test(raw);
  const decimals=(cleaned.split('.')[1]||'').length;
  const dur=1600;
  const start=performance.now();
  function step(now){
    const t=Math.min(1,(now-start)/dur);
    const v=target*easeOutCubic(t);
    let s=decimals>0?v.toFixed(decimals):Math.round(v).toString();
    if(hasComma){
      const parts=s.split('.');
      parts[0]=parseFloat(parts[0]).toLocaleString('en');
      s=parts.join('.');
    }
    textNode.textContent=s;
    if(t<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
const counterTargets=document.querySelectorAll('.s6 .stat .num, .s2 .right .card .val');
counterTargets.forEach(el=>{
  const tn=getFirstTextNode(el);
  if(!tn) return;
  const raw=tn.textContent.trim();
  if(!/^[\d,.]+$/.test(raw)) return;
  el.dataset.target=raw;
  tn.textContent='0';
});
const counterIO=new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(e.isIntersecting){
      const tn=getFirstTextNode(e.target);
      if(tn && e.target.dataset.target) animateNumberNode(tn,e.target.dataset.target);
      counterIO.unobserve(e.target);
    }
  });
},{threshold:.4});
counterTargets.forEach(el=>counterIO.observe(el));

/* ====== Confetti burst on click (celebration for cover/closing) ====== */
function confettiBurst(x,y){
  const colors=['#d5b200','#d2372f','#4e3a93','#19aea9','#07993F','#FFEC8D'];
  const N=24;
  for(let i=0;i<N;i++){
    const c=document.createElement('div');
    c.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:10px;height:14px;background:${colors[i%colors.length]};border-radius:2px;pointer-events:none;z-index:9999;will-change:transform,opacity`;
    document.body.appendChild(c);
    const ang=(i/N)*Math.PI*2;
    const vel=140+Math.random()*120;
    const dx=Math.cos(ang)*vel;
    const dy=Math.sin(ang)*vel-80;
    c.animate(
      [{transform:'translate(0,0) rotate(0deg)',opacity:1},
       {transform:`translate(${dx}px,${dy+400}px) rotate(${720*Math.random()-360}deg)`,opacity:0}],
      {duration:1200+Math.random()*400,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'}
    ).onfinish=()=>c.remove();
  }
}
document.querySelectorAll('.s1 h1, .s18 h1, .aichi-emblem').forEach(el=>{
  el.style.cursor='pointer';
  el.addEventListener('click',e=>{
    if(document.body.classList.contains('editing'))return; // editing takes priority
    confettiBurst(e.clientX,e.clientY);
  });
});

/* ====== Parallax tilt on cover emblem ====== */
const emblem=document.querySelector('.s1 .emblem-side');
if(emblem){
  const cover=document.querySelector('#s1');
  cover.addEventListener('mousemove',e=>{
    const r=cover.getBoundingClientRect();
    const dx=((e.clientX-r.left)/r.width-.5)*8;
    const dy=((e.clientY-r.top)/r.height-.5)*8;
    emblem.style.transform=`translateY(-50%) translate(${dx}px,${dy}px) rotateY(${dx*.4}deg) rotateX(${-dy*.4}deg)`;
  });
  cover.addEventListener('mouseleave',()=>{emblem.style.transform='translateY(-50%)'});
}
