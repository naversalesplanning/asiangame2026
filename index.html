<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>2026 아이치-나고야 아시안게임 | 네이버 프리미엄 광고 패키지</title>
<link rel="preconnect" href="https://hangeul.pstatic.net">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
/* ============ NANUM SQUARE NEO (fonts-archive CDN — VERIFIED working) ============ */
@import url('https://cdn.jsdelivr.net/gh/fonts-archive/NanumSquareNeo/NanumSquareNeo.css');
*{font-family:'Nanum Square Neo','Nanum Square Neo','Pretendard Variable',system-ui,-apple-system,sans-serif !important}
:root{
  /* Aichi-Nagoya 2026 official palette */
  --green-darkest:#1a1410;   /* dark warm base */
  --green-deep:#322d2a;       /* brand dark (site #322d2a) */
  --green:#d2372f;            /* brand red (site #d2372f) */
  --green-bright:#d5b200;     /* signature gold/mustard (site #d5b200) */
  --gold:#d5b200;             /* signature gold */
  --gold-bright:#FFEC8D;      /* pale cream-yellow (site #FFEC8D) */
  --gold-deep:#a6783e;        /* bronze tone (site #a6783e) */
  --sand:#f3ecdb;
  --cream:#f7f2e6;
  --ink:#322d2a;
  --ink-soft:#4a3f37;
  --mute:rgba(247,242,230,.6);
  --mute-strong:rgba(247,242,230,.82);
  --line:rgba(247,242,230,.16);
  --accent-red:#BF0D0D;       /* deep red (site #BF0D0D) */
  /* multi-color accents (Asian Games rainbow) */
  --purple:#4e3a93;
  --teal:#19aea9;
  --teal-bright:#4cc0bc;
  --green-asia:#07993F;
  --orange:#e87e20;
  --coral:#FE6152;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--cream);font-family:'Nanum Square Neo','Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif;font-feature-settings:"ss01","tnum";-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}

/* ============ PASSWORD GATE ============ */
.gate{position:fixed;inset:0;z-index:9999;background:radial-gradient(80% 100% at 50% 100%,rgba(210,55,47,.18) 0%,transparent 60%),linear-gradient(180deg,#1a1410 0%,#322d2a 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif}
.gate.hidden{display:none}
.gate-box{width:min(92vw,460px);padding:48px 44px;background:rgba(255,255,255,.04);border:1px solid rgba(213,178,0,.25);border-radius:16px;backdrop-filter:blur(20px);text-align:center;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.gate-naver{margin:0 auto 28px;display:flex;justify-content:center}
.gate-naver img{width:130px;height:auto;display:block;max-height:32px;object-fit:contain}
.gate-box h1{font-size:24px;font-weight:900;letter-spacing:-.01em;line-height:1.25;margin-bottom:10px}
.gate-box h1 em{font-style:normal;color:#FFEC8D}
.gate-box .sub{font-size:13px;color:rgba(255,255,255,.55);letter-spacing:.04em;margin-bottom:32px;line-height:1.6}
.gate-form{display:flex;gap:8px;flex-direction:column}
.gate-form input{padding:14px 18px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.16);border-radius:10px;color:#fff;font-size:15px;font-family:inherit;outline:none;transition:.2s;letter-spacing:.04em}
.gate-form input:focus{border-color:#d5b200;background:rgba(0,0,0,.55)}
.gate-form button{padding:14px;background:linear-gradient(135deg,#d5b200,#a6783e);color:#1a1410;font-size:14px;font-weight:900;letter-spacing:.06em;border:none;border-radius:10px;cursor:pointer;transition:.2s;text-transform:uppercase}
.gate-form button:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(213,178,0,.3)}
.gate-err{margin-top:14px;font-size:12px;color:#ff7373;min-height:16px;letter-spacing:.02em}
.gate-foot{margin-top:24px;font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.3);text-transform:uppercase}

/* ---------- deck shell ---------- */
.deck{display:flex;flex-direction:column;align-items:center;gap:24px;padding:32px 0 96px}
.slide{
  position:relative;width:min(96vw,1600px);aspect-ratio:16/9;
  background:var(--ink);border-radius:14px;overflow:hidden;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);
  isolation:isolate;
  container-type:inline-size;
  container-name:slide;
}
.slide .pageno{display:none}
.slide .topbar{position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#d2372f 0%,#d5b200 50%,#4e3a93 100%);z-index:6;opacity:.8}

/* Brand mark visible ONLY on cover (s1) and closing (s18) */
.slide .brand-mark{display:none}
#s18 .brand-mark{display:inline-flex}

/* ---------- NAVER brand mark (Wikipedia commons logotype) ---------- */
.brand-mark{position:absolute;left:30px;top:22px;z-index:7;display:inline-flex;align-items:center;gap:10px;transition:opacity .2s}
.brand-mark .nv-logo{display:inline-block;width:72px;height:18px}
.brand-mark .nv-logo img{display:block;width:100%;height:100%;object-fit:contain}
.brand-mark .tag{display:none}
@keyframes nv-pulse{0%{box-shadow:0 0 0 0 rgba(3,199,90,.5)}70%{box-shadow:0 0 0 10px rgba(3,199,90,0)}100%{box-shadow:0 0 0 0 rgba(3,199,90,0)}}

/* ---------- universal animations ---------- */
@keyframes float-slow{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes float-fast{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spin-slow{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes drift{0%{transform:translateX(-100%)}100%{transform:translateX(100vw)}}
@keyframes drop-petal{0%{transform:translate(0,-20vh) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(40px,110vh) rotate(540deg);opacity:0}}
@keyframes sun-pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.05);opacity:1}}
@keyframes torch-flicker{0%,100%{transform:translateY(0) scale(1);filter:brightness(1)}50%{transform:translateY(-2px) scale(1.05);filter:brightness(1.2)}}
@keyframes shine{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes track-dash{to{stroke-dashoffset:-40}}
@keyframes ring-grow{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes count-flash{0%{color:#fff}50%{color:var(--gold-bright)}100%{color:#fff}}
@keyframes runner-run{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@keyframes ripple{0%{transform:scale(.8);opacity:.6}100%{transform:scale(2.4);opacity:0}}

/* ---------- Aichi-Nagoya 2026 Official Emblem ---------- */
.aichi-emblem{display:block;width:100%;height:100%}
.aichi-emblem .crescent{transition:transform .6s cubic-bezier(.2,.7,.2,1);animation:crescent-breathe 6s ease-in-out infinite;transform-origin:250px 280px;transform-box:view-box}
.aichi-emblem .crescent.cr-y{animation-delay:.6s}
.aichi-emblem .crescent.cr-g{animation-delay:1.2s;transform-origin:250px 420px}
.aichi-emblem:hover .crescent.cr-p{animation:none;transform:translate(-8px,-4px) rotate(-3deg)}
.aichi-emblem:hover .crescent.cr-y{animation:none;transform:translate(8px,-4px) rotate(3deg)}
.aichi-emblem:hover .crescent.cr-g{animation:none;transform:translateY(6px) scale(1.05)}
@keyframes crescent-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes oca-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes oca-beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

.emblem-side{position:absolute;left:6%;top:50%;transform:translateY(-50%);width:29%;max-width:360px;aspect-ratio:5/6;z-index:2;pointer-events:auto;display:flex;align-items:center;justify-content:center}
.cover-img-wrap{position:relative;width:100%;height:100%;border-radius:18px;overflow:hidden}
.aichi-logo{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;z-index:2;filter:drop-shadow(0 24px 50px rgba(0,0,0,.55));transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.aichi-logo:hover{transform:scale(1.04)}
.cover-img-wrap:not(.no-img) .cover-ph-fallback{display:none}
.cover-ph-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.04),rgba(255,255,255,.04) 12px,rgba(255,255,255,.08) 12px,rgba(255,255,255,.08) 24px);border:1px dashed rgba(213,178,0,.35);border-radius:18px;color:rgba(247,242,230,.7);text-align:center;padding:24px;z-index:1}
.cover-ph-fallback .ph-tag{font-size:12px;font-weight:800;letter-spacing:.22em;color:#FFEC8D;padding:5px 14px;background:rgba(213,178,0,.15);border-radius:99px;border:1px solid rgba(213,178,0,.4)}
.cover-ph-fallback .ph-path{font-size:14px;font-family:'JetBrains Mono','SF Mono',monospace;color:rgba(247,242,230,.92);line-height:1.5;font-weight:700}
.cover-ph-fallback .ph-hint{font-size:11px;color:rgba(247,242,230,.5);line-height:1.5;margin-top:4px}
.emblem-side .aichi-emblem text{font-family:'Nanum Square Neo','Pretendard Variable','Inter',sans-serif}

/* small OCA sun stamp for accents */
.oca-stamp{display:inline-block;width:64px;height:64px;pointer-events:none}
.oca-stamp svg{width:100%;height:100%;display:block}
.oca-stamp .oca-sun{transform-origin:center;transform-box:fill-box;animation:oca-spin 50s linear infinite}
.oca-stamp.corner{position:absolute;right:80px;top:80px;z-index:3}

/* mouse-follow spotlight on dark slides */
.spotlight{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(213,178,0,.06) 0%,transparent 70%);pointer-events:none;transform:translate(-50%,-50%);z-index:0;mix-blend-mode:screen;transition:opacity .3s;opacity:0}
.slide:hover .spotlight{opacity:1}

/* ---------- cherry blossoms (subtle, drift across) ---------- */
.sakura{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.sakura .petal{position:absolute;top:-10%;width:8px;height:8px;background:radial-gradient(circle at 35% 30%,#fff0f5 0%,#ffc8d8 55%,#f3a4be 100%);border-radius:50% 0 50% 50%;opacity:.5;animation:drop-petal 18s linear infinite;filter:blur(.3px)}
.sakura .petal:nth-child(1){left:14%;animation-delay:0s;animation-duration:20s}
.sakura .petal:nth-child(2){left:32%;animation-delay:4s;animation-duration:17s;transform:scale(.7)}
.sakura .petal:nth-child(3){left:58%;animation-delay:8s;animation-duration:22s;transform:scale(1.1)}
.sakura .petal:nth-child(4){left:74%;animation-delay:2s;animation-duration:19s;transform:scale(.85)}
.sakura .petal:nth-child(5){left:88%;animation-delay:11s;animation-duration:21s;transform:scale(.75)}
.sakura .petal:nth-child(6){left:46%;animation-delay:14s;animation-duration:23s;transform:scale(1)}

/* ---------- interactive: hover & focus ---------- */
.s4 .card,.s6 .stat,.s13 .pk,.s16 .sp{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,filter .35s}
.s4 .card:hover,.s16 .sp:hover{transform:translateY(-6px);box-shadow:0 18px 40px -16px rgba(0,0,0,.35)}
.s6 .stat:hover{transform:translateY(-4px) scale(1.02);z-index:3;box-shadow:0 22px 40px -18px rgba(210,55,47,.4)}
.s13 .pk:hover{transform:translateY(-8px);box-shadow:0 26px 50px -20px rgba(213,178,0,.4);filter:brightness(1.04)}
.s13 .pk:nth-child(1){animation:gold-shimmer 5s ease-in-out infinite}
@keyframes gold-shimmer{0%,100%{box-shadow:0 0 0 0 rgba(213,178,0,0)}50%{box-shadow:0 0 30px 0 rgba(213,178,0,.35)}}

/* sports floating gallery */
.sport-float{position:absolute;pointer-events:none;z-index:1;display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1;filter:grayscale(.2)}
.sport-float svg{display:block;width:100%;height:100%}
.sport-float.f1{animation:float-slow 6s ease-in-out infinite}
.sport-float.f2{animation:float-slow 7s ease-in-out infinite reverse}
.sport-float.f3{animation:float-fast 5s ease-in-out infinite}
.sport-float.f4{animation:float-slow 8s ease-in-out infinite}
.sport-float.f5{animation:float-fast 6s ease-in-out infinite reverse}

/* running track dashed motif */
.track-motif{position:absolute;left:0;right:0;bottom:0;height:60px;pointer-events:none;opacity:.18;z-index:1}
.track-motif svg{width:100%;height:100%}
.track-motif .lane{stroke:var(--gold);stroke-width:1.5;fill:none;stroke-dasharray:8 6;animation:track-dash 1.4s linear infinite}

/* live indicator */
.live-dot{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;background:var(--accent-red);color:#fff;border-radius:99px;font-size:10px;font-weight:800;letter-spacing:.12em}
.live-dot::before{content:"";width:6px;height:6px;background:#fff;border-radius:50%;animation:nv-pulse 1.2s infinite}

/* medal icon for package tiers */
.medal-ico{display:inline-flex;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;font-size:18px;font-weight:900;position:relative;flex:0 0 36px}
.medal-ico::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);width:14px;height:18px;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);margin-top:-4px}
.medal-gold{background:radial-gradient(circle at 30% 30%,#f5d568,#c8941b);color:#5a3e08;box-shadow:0 0 12px rgba(213,178,0,.5),inset 0 -3px 4px rgba(0,0,0,.2)}
.medal-gold::after{background:linear-gradient(180deg,#d2372f,#8a1a14)}
.medal-silver{background:radial-gradient(circle at 30% 30%,#e8edf2,#8a939a);color:#3a3f44;box-shadow:0 0 10px rgba(232,237,242,.4),inset 0 -3px 4px rgba(0,0,0,.2)}
.medal-silver::after{background:linear-gradient(180deg,#4e3a93,#2a1f5a)}
.medal-bronze{background:radial-gradient(circle at 30% 30%,#e3a772,#7a3f1a);color:#3f1e08;box-shadow:0 0 10px rgba(167,99,46,.4),inset 0 -3px 4px rgba(0,0,0,.2)}
.medal-bronze::after{background:linear-gradient(180deg,#0a6b3d,#063018)}
.medal-finalist{background:radial-gradient(circle at 30% 30%,#ff8077,#8a1a14);color:#fff;box-shadow:0 0 10px rgba(210,55,47,.4),inset 0 -3px 4px rgba(0,0,0,.2)}
.medal-finalist::after{background:linear-gradient(180deg,#19aea9,#0a5957)}
.medal-opener{background:radial-gradient(circle at 30% 30%,#8e7cd8,#3a2a78);color:#fff;box-shadow:0 0 10px rgba(78,58,147,.4),inset 0 -3px 4px rgba(0,0,0,.2)}
.medal-opener::after{background:linear-gradient(180deg,#e87e20,#a64e08)}

/* torch */
.torch{position:absolute;width:54px;height:90px;display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:2}
.torch .flame{width:30px;height:42px;background:radial-gradient(ellipse at 50% 80%,#ffd24a 0%,#ff7a1a 40%,#d2372f 70%,transparent 100%);border-radius:50% 50% 30% 30%;animation:torch-flicker 1.6s ease-in-out infinite;filter:drop-shadow(0 0 12px rgba(255,122,26,.6))}
.torch .handle{width:6px;flex:1;background:linear-gradient(180deg,#a6783e,#5a3f20);border-radius:3px;margin-top:-4px}

/* ---------- Image placeholders for mockups ---------- */
.mock-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:3;border-radius:inherit}
.ph-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:repeating-linear-gradient(45deg,#f3ecdb,#f3ecdb 10px,#ede4c9 10px,#ede4c9 20px);color:rgba(11,20,16,.55);font-family:'Nanum Square Neo','Pretendard Variable',sans-serif;text-align:center;padding:12px;z-index:2;border-radius:inherit}
.ph-fallback .ph-tag{font-size:10px;font-weight:800;letter-spacing:.16em;color:#d2372f;padding:3px 9px;background:#fff;border-radius:99px;border:1px solid rgba(210,55,47,.3)}
.ph-fallback .ph-path{font-size:10px;font-family:'JetBrains Mono','SF Mono',monospace;color:rgba(11,20,16,.7);line-height:1.4;word-break:break-all}
.ph-fallback .ph-hint{font-size:10px;color:rgba(11,20,16,.45);line-height:1.4;margin-top:4px}
.ph-fallback.small{padding:6px;gap:4px}
.ph-fallback.small .ph-tag{font-size:9px;padding:2px 6px}
.ph-fallback.small .ph-path{font-size:8px;line-height:1.3}

/* Strip inner padding/gap on mockup containers when image fills */
.phone .scr,.mini-phone .ms,.lap .scr,.mp .scr,.s7 .mock{position:relative !important;overflow:hidden}
.phone .scr,.mini-phone .ms,.lap .scr,.mp .scr{padding:0 !important;gap:0 !important;background:#0a0a0a !important}
.s7 .mock{padding:0 !important;gap:0 !important;background:#0a0a0a !important}

/* ---------- typography ---------- */
/* Hide all eyebrow labels except on chapter dividers (.s-div .eyebrow stays) */
.eyebrow{display:none}
.s-div .eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.32em;color:var(--gold-bright);text-transform:uppercase;font-weight:700;justify-content:center}
.s-div .eyebrow::before,.s-div .eyebrow::after{content:"";width:28px;height:1px;background:var(--gold)}
.s2 .h-eyebrow{display:none}
h1.kicker{font-size:clamp(40px,5.8cqw,88px);line-height:1.02;font-weight:900;letter-spacing:-.02em}
h2.kicker{font-size:clamp(28px,3.55cqw,54px);line-height:1.08;font-weight:900;letter-spacing:-.018em}
h3.kicker{font-size:clamp(20px,2.08cqw,30px);line-height:1.18;font-weight:800;letter-spacing:-.012em}
.lead{font-size:clamp(15px,1.1cqw,18px);line-height:1.55;color:var(--mute-strong)}
.gold{color:var(--gold-bright)}
.green{color:var(--green-bright)}
.red{color:#ff7373}

/* ---------- shared bg motifs ---------- */
.diag-light{background:linear-gradient(110deg,var(--ink) 0%,var(--ink) 48%,var(--cream) 48.2%,var(--cream) 100%)}
.diag-dark{background:linear-gradient(110deg,var(--green-darkest) 0%,var(--green-deep) 48%,#0a1410 48.2%,#0a1410 100%)}
.cream-bg{background:var(--cream);color:var(--ink)}
.deep-bg{background:radial-gradient(120% 80% at 80% -10%,#3a2820 0%,transparent 60%),var(--ink)}

/* ---------- big number bg shadow ---------- */
.bignum-ghost{font-family:'Nanum Square Neo','Pretendard Variable',sans-serif;font-weight:900;font-size:clamp(120px,18.75cqw,260px);line-height:.85;color:rgba(255,255,255,.04);letter-spacing:-.04em;position:absolute;pointer-events:none}

/* ---------- SLIDE 1 ---------- */
.s1{background:radial-gradient(80% 100% at 50% 110%,#d2372f33 0%,transparent 60%),linear-gradient(180deg,#1a1410 0%,#1a1410 50%,#28201c 100%)}
.s1::before{content:"";position:absolute;inset:0;background:
  radial-gradient(2px 2px at 18% 22%,rgba(232,196,106,.6),transparent 60%),
  radial-gradient(2px 2px at 78% 18%,rgba(232,196,106,.5),transparent 60%),
  radial-gradient(1.5px 1.5px at 30% 70%,rgba(232,196,106,.4),transparent 60%),
  radial-gradient(1.5px 1.5px at 70% 80%,rgba(232,196,106,.45),transparent 60%);
  z-index:1}
.s1 .frame{position:absolute;inset:34px;border:1px solid rgba(232,196,106,.25);border-radius:6px;z-index:1}
.s1 .frame::before,.s1 .frame::after{content:"";position:absolute;width:24px;height:24px;border:2px solid var(--gold-bright)}
.s1 .frame::before{top:-2px;left:-2px;border-right:none;border-bottom:none}
.s1 .frame::after{bottom:-2px;right:-2px;border-left:none;border-top:none}
.s1 .corner-tr,.s1 .corner-bl{position:absolute;width:24px;height:24px;border:2px solid var(--gold-bright);z-index:2}
.s1 .corner-tr{top:32px;right:32px;border-left:none;border-bottom:none}
.s1 .corner-bl{bottom:32px;left:32px;border-right:none;border-top:none}
.s1 .nav{position:absolute;top:48px;right:64px;display:flex;align-items:center;gap:12px;z-index:5}
.s1 .nav .logo{display:inline-block;width:96px;height:22px}
.s1 .nav .logo img{display:block;width:100%;height:100%;object-fit:contain}
.s1 .brand-mark{display:none}
.s1 .nav .divider{width:1px;height:18px;background:rgba(255,255,255,.2)}
.s1 .nav .tag{font-size:11px;letter-spacing:.3em;color:var(--mute);text-transform:uppercase}
.s1 .center{position:absolute;right:5%;top:50%;transform:translateY(-50%);width:48%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;z-index:4;text-align:left}
.s1 .badge{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border:1px solid rgba(232,196,106,.4);border-radius:99px;color:var(--gold-bright);font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:700;margin-bottom:28px}
.s1 .badge .dot{width:6px;height:6px;background:var(--gold-bright);border-radius:50%;box-shadow:0 0 12px var(--gold-bright)}
.s1 h1{font-size:4.25cqw;line-height:1.14;font-weight:900;letter-spacing:-.025em;color:#fff;margin-bottom:18px;font-family:'Nanum Square Neo','Pretendard Variable','Inter',sans-serif}
.s1 h1 .big{display:block}
.s1 h1 .big:first-child{color:#fff;opacity:.92}

/* 신청/문의 CTA 버튼 (네이버 폼 연결) */
.deck .apply-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 30px;border-radius:999px;font-weight:900;font-size:16px;text-decoration:none;letter-spacing:-.01em;background:#d2372f;color:#fff;box-shadow:0 12px 26px -8px rgba(210,55,47,.5);transition:transform .15s ease,box-shadow .15s ease}

/* ---------- SLIDE 16 (종목 독점) ---------- */
.s16{background:var(--ink);color:#fff;padding:3.13cqw 3.5cqw;position:relative;display:flex;flex-direction:column}

.s16 .eyebrow{color:var(--gold-bright)}
.s16 h2{font-size:36px;font-weight:900;line-height:1.1;margin-top:14px;letter-spacing:-.018em}

.s16 .sub{margin-top:8px;color:var(--mute-strong);font-size:14px}
.s16 .sports{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:.75cqw;flex:1;min-height:0;margin-top:.75cqw}
.s16 .sp{border:1px solid var(--line);border-radius:12px;padding:1cqw 1.13cqw;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));position:relative;overflow:hidden;display:flex;flex-direction:column;gap:.5cqw}
.s16 .sp::before{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;opacity:.1}
.s16 .sp.soc::before{background:radial-gradient(circle,var(--accent-red),transparent 60%)}
.s16 .sp.bbl::before{background:radial-gradient(circle,var(--gold-bright),transparent 60%)}

.s16 .sp .ico{width:2.5cqw;height:2.5cqw;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.31cqw;font-weight:900}
.s16 .sp.soc .ico{background:rgba(181,54,54,.15);color:var(--accent-red)}
.s16 .sp.bbl .ico{background:rgba(232,196,106,.15);color:var(--gold-bright)}
.s16 .sp.bv .ico{background:rgba(213,178,0,.15);color:var(--green-bright)}
.s16 .sp .name{font-size:1.25cqw;font-weight:900;letter-spacing:-.005em}
.s16 .sp .name span{display:block;font-size:.63cqw;color:var(--mute);letter-spacing:.16em;font-weight:600;margin-top:2px;text-transform:uppercase}
.s16 .sp .pitch{font-size:.81cqw;color:var(--mute-strong);line-height:1.45}
.s16 .sp .feats{list-style:none;display:flex;flex-direction:column;gap:.31cqw;padding-top:.5cqw;border-top:1px dashed var(--line)}
.s16 .sp .feats li{display:flex;justify-content:space-between;font-size:.75cqw;color:rgba(247,242,230,.78)}
.s16 .sp .feats li b{color:#fff;font-weight:700}
.s16 .sp .feats li .v{color:var(--gold-bright);font-weight:700}

.s16 .sp .price .lab{font-size:.63cqw;color:var(--mute);letter-spacing:.14em;text-transform:uppercase}
.s16 .sp .price .val{font-size:1.63cqw;font-weight:900;letter-spacing:-.02em;color:#fff}
.s16 .sp .price .val .x{font-size:.81cqw;color:var(--gold-bright);margin-left:2px;font-weight:700}

/* ---------- SLIDE 17 (유의사항) ---------- */
.s17{background:var(--cream);color:var(--ink);padding:64px 80px;display:flex;flex-direction:column;justify-content:center;gap:24px}
.s17 h2{font-size:36px;font-weight:900;letter-spacing:-.018em}
.s17 h2 em{font-style:normal;color:var(--green)}

.s17 .notes li{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;background:#fff;border-radius:10px;border:1px solid rgba(11,20,16,.06);font-size:13px;line-height:1.55;color:rgba(11,20,16,.75)}

.s17 .notes li .red{color:var(--accent-red);font-weight:800}

/* ---------- SLIDE 18 (E.O.D. — WorldCup deck final-page format) ---------- */
.s18{background:linear-gradient(180deg,#d2372f 0%,#a82926 100%);color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6cqw 5cqw}

.s18 .eod{font-size:clamp(48px,6cqw,84px);font-weight:900;letter-spacing:.08em;color:#fff;line-height:1;margin-top:8px;font-family:'Nanum Square Neo','Inter',sans-serif}
.s18 .contact{font-size:14px;line-height:1.7;color:#fff;font-weight:500;z-index:2;text-align:center}

/* ---------- nav HUD ---------- */
.hud{position:fixed;right:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:20}
.hud a{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18);transition:.2s}
.hud a:hover{background:var(--gold-bright);transform:scale(1.4)}
.hud a.on{background:var(--gold-bright)}
.toolbar{position:fixed;left:18px;bottom:18px;display:flex;gap:8px;z-index:20}
.toolbar button{padding:8px 14px;background:rgba(0,0,0,.6);border:1px solid rgba(232,196,106,.3);color:var(--gold-bright);font-size:12px;font-weight:700;letter-spacing:.06em;border-radius:99px;cursor:pointer;backdrop-filter:blur(10px)}
.toolbar button:hover{background:rgba(232,196,106,.12)}
.toolbar button:disabled{opacity:.55;cursor:default}
#editBtn.on{background:linear-gradient(135deg,#d5b200,#a6783e);color:#1a1410;border-color:#d5b200}
/* secret edit controls: hidden unless unlocked via ?edit=<key> URL */
#editBtn,#exportBtn,#resetBtn{display:none}
body.edit-enabled #editBtn{display:inline-block}
body.edit-enabled.editing #exportBtn,body.edit-enabled.editing #resetBtn{display:inline-block}
body.presenting #editBtn,body.presenting #exportBtn,body.presenting #resetBtn{display:none !important}
/* 📌 수정요청(annotation) 모드 */
#annotBtn{display:none}
body.edit-enabled #annotBtn{display:inline-block}
body.presenting #annotBtn{display:none !important}
#annotBtn.on{background:#d2372f;color:#fff;border-color:#d2372f}
body.annotating .deck .slide *:hover{outline:2px dashed #d2372f;outline-offset:2px;cursor:crosshair}
.annot-pin{position:absolute;z-index:60;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#d2372f;color:#fff;font-size:13px;font-weight:800;line-height:24px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.45);pointer-events:none}
body:not(.annotating) .annot-pin{display:none}
.annot-panel{position:fixed;right:14px;bottom:64px;z-index:1000;background:rgba(20,16,12,.96);color:#f7f2e6;border:1px solid rgba(213,178,0,.45);border-radius:12px;padding:12px 14px;font-size:12px;max-width:360px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
body:not(.annotating) .annot-panel{display:none}
.annot-panel .ap-list{max-height:180px;overflow:auto;margin:8px 0;display:flex;flex-direction:column;gap:4px}
.annot-panel .ap-list .ap-item{padding:5px 8px;background:rgba(255,255,255,.06);border-radius:6px;line-height:1.35}
.annot-panel .ap-btns{display:flex;gap:6px;margin-top:6px}
.annot-panel .ap-btns button{flex:1;padding:7px 0;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#f7f2e6;font-weight:800;font-size:12px;cursor:pointer}
.annot-panel .ap-btns .ap-copy{background:#d5b200;color:#1a1410;border-color:#d5b200}

/* ---------- EDIT MODE ---------- */
.edit-banner{display:none;position:fixed;top:0;left:0;right:0;z-index:9997;background:linear-gradient(90deg,#d5b200,#a6783e);color:#1a1410;font-size:13px;font-weight:800;letter-spacing:.02em;padding:9px 16px;align-items:center;justify-content:center;gap:14px;box-shadow:0 4px 16px rgba(0,0,0,.28)}
.edit-banner .hint{font-weight:600;opacity:.82;font-size:12px}
body.editing .edit-banner{display:flex}
body.presenting .edit-banner{display:none !important}
body.editing [contenteditable]{cursor:text;border-radius:3px;transition:background .12s,outline .12s}
body.editing [contenteditable]:hover{outline:1px dashed rgba(213,178,0,.75);outline-offset:2px;background:rgba(213,178,0,.07)}
body.editing [contenteditable]:focus{outline:2px solid #d5b200;outline-offset:2px;background:rgba(213,178,0,.12)}
body.editing .img-editable{cursor:pointer;position:relative}
body.editing .img-editable:hover{outline:2px dashed #d2372f;outline-offset:2px;border-radius:6px}
body.editing .img-editable:hover::after{content:'🖼 클릭해서 이미지 교체';position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#FFEC8D;font-size:11px;font-weight:700;padding:4px 11px;border-radius:99px;z-index:50;white-space:nowrap;pointer-events:none}
@media print{.edit-banner{display:none !important}[contenteditable]{outline:none !important;background:none !important}}

/* ===== AM slide builder (add / delete custom slides) ===== */
#addBtn{display:none}
body.edit-enabled.editing #addBtn{display:inline-block}
body.presenting #addBtn{display:none !important}

/* slide add palette */
.palette{position:fixed;inset:0;z-index:10000;background:rgba(10,10,10,.62);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.palette[hidden]{display:none}
.palette-box{background:#221d19;border:1px solid rgba(213,178,0,.3);border-radius:18px;padding:28px 30px;width:min(92vw,640px);box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
.palette-h{color:#FFEC8D;font-size:18px;font-weight:900;letter-spacing:.02em;margin-bottom:18px}
.palette-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.palette-item{display:block;text-align:left;background:#2c2620;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .15s,transform .12s}
.palette-item:hover{border-color:#d5b200;transform:translateY(-2px)}
.pi-prev{height:104px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;letter-spacing:.04em;margin-bottom:10px;overflow:hidden}
.pi-offer{background:radial-gradient(70% 70% at 50% 40%,rgba(210,55,47,.35),transparent),linear-gradient(135deg,#1a1410,#2a2018);color:#FFEC8D;font-size:15px}
.pi-offer span{color:#d5b200;font-size:20px}
.pi-blank{background:repeating-linear-gradient(45deg,#f3ecdb,#f3ecdb 12px,#ede4c9 12px,#ede4c9 24px);color:rgba(11,20,16,.55);font-size:13px}
.pi-pkg{background:linear-gradient(135deg,#3a2f12,#d5b200 280%);color:#1a1410;font-size:14px;font-weight:900}
.pi-pkg span{font-size:20px}
.pi-name{color:#fff;font-weight:800;font-size:14px}
.pi-desc{color:rgba(255,255,255,.55);font-size:11.5px;margin-top:3px}
.palette-cancel{margin-top:18px;width:100%;padding:11px;background:transparent;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.8);border-radius:99px;font-weight:700;cursor:pointer}
.palette-cancel:hover{background:rgba(255,255,255,.06)}

/* per-custom-slide controls (only while editing) */
.slide-ctrls{display:none}
body.editing .slide[data-custom] .slide-ctrls{display:flex;gap:6px;position:absolute;top:10px;right:10px;z-index:40}
.slide-ctrls button{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.62);color:#FFEC8D;font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.slide-ctrls button:hover{background:rgba(210,55,47,.85);color:#fff}
.slide-ctrls .sc-del:hover{background:#d2372f}
.slide[data-custom]{outline:2px dashed rgba(213,178,0,0)}
body.editing .slide[data-custom]{outline:2px dashed rgba(213,178,0,.5);outline-offset:-4px}

/* insert zone (＋ 여기에 추가) between slides — edit mode only */
.insert-zone{display:none}
body.editing .insert-zone{display:flex;align-items:center;justify-content:center;width:min(96vw,1600px);margin:-12px 0;height:24px;opacity:.3;transition:opacity .15s;cursor:pointer}
body.editing .insert-zone:hover{opacity:1}
.insert-zone::before,.insert-zone::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,rgba(213,178,0,.6) 0 9px,transparent 9px 18px)}
.iz-btn{flex:0 0 auto;margin:0 12px;background:#d5b200;color:#1a1410;border:none;border-radius:99px;padding:6px 16px;font-size:12.5px;font-weight:800;letter-spacing:.02em;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.32);white-space:nowrap}
.iz-btn:hover{background:#FFEC8D}

/* editable price table: row delete (✕) + add-row button (edit mode, custom slides only) */
.rowdel{display:none}
body.editing .slide[data-custom] .rowdel{display:inline-flex;position:absolute;right:2px;top:50%;transform:translateY(-50%);width:16px;height:16px;align-items:center;justify-content:center;border:none;border-radius:50%;background:#d2372f;color:#fff;font-size:9px;line-height:1;cursor:pointer;z-index:6;padding:0}
.rowdel:hover{background:#a01b15}
.addrow-btn{display:none}
body.editing .slide[data-custom] .addrow-btn{display:inline-block;margin-top:8px;background:rgba(213,178,0,.16);border:1px dashed rgba(213,178,0,.6);color:#d5b200;border-radius:8px;padding:4px 12px;font-size:11px;font-weight:800;cursor:pointer}
body.editing .slide[data-custom] .addrow-btn:hover{background:rgba(213,178,0,.28)}
.tbl td.auto{color:#d5b200;font-weight:800}

/* AM mode: hard-lock standard slides */
.lock-badge{display:none}
body.am-mode.editing .slide:not([data-custom]) .lock-badge{display:flex;align-items:center;gap:7px;position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:45;background:rgba(0,0,0,.72);color:#bdb6ad;font-size:12px;font-weight:800;letter-spacing:.02em;padding:6px 14px;border-radius:99px;backdrop-filter:blur(8px);white-space:nowrap}
body.am-mode.editing .slide:not([data-custom]){filter:grayscale(.12) brightness(.96)}

/* ===== custom slide templates ===== */
/* Special Offer for You */
.s-offer{background:linear-gradient(140deg,#1a1410 0%,#2a2018 55%,#0f0b08 100%);color:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.s-offer .of-bg{position:absolute;inset:0;background:radial-gradient(55% 55% at 50% 38%,rgba(210,55,47,.22) 0%,transparent 62%);z-index:0}
.s-offer .of-wrap{position:relative;z-index:2;text-align:center;width:84%;max-width:1180px}
.s-offer .of-eyebrow{font-size:1.05cqw;letter-spacing:.34em;color:#FFEC8D;font-weight:800;text-transform:uppercase;margin-bottom:1.6cqw}
.s-offer .of-title{font-size:5.2cqw;font-weight:900;line-height:1.04;letter-spacing:-.01em;margin:0}
.s-offer .of-title em{font-style:normal;background:linear-gradient(90deg,#FFEC8D,#d5b200);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.s-offer .of-h{font-size:1.7cqw;font-weight:900;color:#FFEC8D;margin-bottom:.8cqw}
.s-offer .of-b{font-size:1.35cqw;color:rgba(247,242,230,.82);line-height:1.5}

/* Blank canvas (title + body + 1 image) */
.s-blank{background:var(--ink);color:#fff;display:flex;align-items:center;gap:4cqw;padding:0 7cqw}
.s-blank .bl-wrap{flex:1;min-width:0}
.s-blank .bl-eyebrow{font-size:1.05cqw;letter-spacing:.32em;color:#d5b200;font-weight:800;text-transform:uppercase;margin-bottom:1.4cqw}
.s-blank .bl-title{font-size:4cqw;font-weight:900;line-height:1.08;margin:0 0 2cqw}

.cust-imgbox{position:relative;width:100%;height:100%;border-radius:1cqw;overflow:hidden}
.cust-imgbox .mock-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;border-radius:inherit}
.cust-imgbox .cust-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;background:repeating-linear-gradient(45deg,rgba(213,178,0,.06),rgba(213,178,0,.06) 12px,rgba(213,178,0,.12) 12px,rgba(213,178,0,.12) 24px);border:1.5px dashed rgba(213,178,0,.4);border-radius:1cqw;color:rgba(247,242,230,.7);font-size:1.5cqw;font-weight:800;text-align:center;z-index:1;line-height:1.4}

/* ---------- print (16:9 full-bleed landscape, full color) ---------- */
@page{size:297mm 167.0625mm;margin:0}
@media print{
  html,body{background:#fff;margin:0;padding:0;width:297mm;height:167.0625mm;-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important}
  body{overflow:visible !important}
  .deck{gap:0;padding:0;margin:0;display:block;width:297mm}
  .hud,.toolbar,.gate,.present-counter{display:none !important}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important}
  .slide{
    width:297mm !important;
    height:167.0625mm !important;
    max-width:none !important;
    max-height:none !important;
    aspect-ratio:auto !important;
    page-break-after:always;
    page-break-inside:avoid;
    break-inside:avoid;
    border-radius:0 !important;
    box-shadow:none !important;
    margin:0 !important;
    transform:none !important;
    inset:auto !important;
    position:relative !important;
    overflow:hidden !important;
    container-type:inline-size !important;
  }
  .slide:last-child{page-break-after:auto}
  /* presentation-mode overrides shouldn't apply during print */
  body.presenting{overflow:visible !important}
  body.presenting .deck{position:static !important;display:block !important;inset:auto !important;width:297mm !important;height:auto !important}
  body.presenting .slide,
  body.presenting .slide.active{display:block !important;position:relative !important;left:auto !important;top:auto !important;inset:auto !important;transform:none !important;width:297mm !important;height:167.0625mm !important;aspect-ratio:auto !important}
}

/* ============ PRESENTATION MODE — 16:9 strict + flex-centered + scale ============ */
/* 슬라이드 내부 레이아웃 무결성 100% 유지. 16:9가 아닌 모니터에선 letterbox 발생 (의도된 동작) */
body.presenting{overflow:hidden;background:#000}
html:has(body.presenting){background:#000}
body.presenting .deck{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:0;gap:0;margin:0;width:100vw;height:100vh}
body.presenting .slide:not(.active){display:none}
body.presenting .slide.active{
  position:relative;
  left:auto;top:auto;
  width:1600px;height:900px;
  aspect-ratio:auto;
  flex:0 0 auto;
  border-radius:0;
  box-shadow:none;
  margin:0;
  transform:scale(min(100vw / 1600, 100vh / 900));
  transform-origin:center center;
  animation:p-fade .35s cubic-bezier(.2,.7,.2,1)
}
body.presenting .hud{display:none}
body.presenting .gate{display:none}
body.presenting .toolbar{position:fixed;bottom:14px;right:14px;left:auto;z-index:9999;opacity:.2;transition:opacity .3s}
body.presenting .toolbar:hover{opacity:1}
body.presenting .toolbar button{background:rgba(0,0,0,.7);font-size:11px;padding:6px 10px}
@keyframes p-fade{from{opacity:0}to{opacity:1}}
/* Slide counter overlay in presentation */
.present-counter{position:fixed;bottom:18px;left:18px;z-index:9998;color:rgba(255,255,255,.55);font-size:12px;font-weight:700;letter-spacing:.16em;font-family:'Nanum Square Neo',sans-serif;display:none;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:99px;backdrop-filter:blur(10px)}
body.presenting .present-counter{display:block}
</style>
</head>

<!-- ============ PASSWORD GATE ============ -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="gate-naver"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/Naver_Logotype.svg/3840px-Naver_Logotype.svg.png" alt="NAVER" onerror="this.style.display='none'"/></div>
    <h1>20th Asian Games<br><em>Aichi-Nagoya 2026</em></h1>
    <p class="sub">비공개 세일즈덱입니다.<br>접근 권한이 있는 분만 입장 가능합니다.</p>
    <form class="gate-form" id="gateForm" autocomplete="off">
      <input type="password" id="gatePw" placeholder="접근 비밀번호" autofocus required />
      <button type="submit">접속하기 →</button>
    </form>
    <p class="gate-err" id="gateErr"></p>
    <div class="gate-foot">NAVER × Aichi-Nagoya 2026</div>
  </div>
</div>

<div class="deck"></div>

<!-- HUD -->

  <button id="editBtn" title="텍스트, 이미지 수정 (E)">✏️ 수정</button>

const PW_CACHE='nag-pw';
const gate=document.getElementById('gate');
const gateForm=document.getElementById('gateForm');
const gatePw=document.getElementById('gatePw');
const gateErr=document.getElementById('gateErr');

const _te=new TextEncoder(), _td=new TextDecoder();
function _b64ToBuf(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function _bufToB64(buf){const u=new Uint8Array(buf);let s='';const CH=0x8000;for(let i=0;i<u.length;i+=CH){s+=String.fromCharCode.apply(null,u.subarray(i,Math.min(i+CH,u.length)));}return btoa(s);}
function _deriveKey(pw,salt){
  return crypto.subtle.importKey('raw',_te.encode(pw),'PBKDF2',false,['deriveKey'])
    .then(base=>crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']));
}
async function decryptDeck(pw){
  const key=await _deriveKey(pw,_b64ToBuf(ENC_SALT));
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:_b64ToBuf(ENC_IV)},key,_b64ToBuf(ENC_DATA));
  return _td.decode(plain);
}
async function encryptDeck(pw,text){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await _deriveKey(pw,salt);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,_te.encode(text));
  return {salt:_bufToB64(salt),iv:_bufToB64(iv),data:_bufToB64(ct)};
}

let deckInited=false;
async function unlockWith(pw){
  if(!pw) return false;
  let plain;
  try{ plain=await decryptDeck(pw); }
  catch(e){ return false; }
  document.querySelector('.deck').innerHTML=plain;
  sessionStorage.setItem(PW_CACHE,pw);
  if(!deckInited){ initDeck(); deckInited=true; }
  gate.classList.add('hidden');
  return true;
}
function lockGate(){ sessionStorage.removeItem(PW_CACHE); location.reload(); }
gateForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const ok=await unlockWith(gatePw.value.trim());
  if(ok){ gateErr.textContent=''; }
  else{ gateErr.textContent='비밀번호가 일치하지 않습니다. 다시 확인해주세요.'; gatePw.value=''; gatePw.focus(); }
});
/* auto-unlock if a password was entered earlier this session */
(function(){ const c=sessionStorage.getItem(PW_CACHE); if(c) unlockWith(c).then(ok=>{ if(!ok) sessionStorage.removeItem(PW_CACHE); }); })();

/* ========== DECK INIT (runs after decryption injects the slides) ========== */
function initDeck(){

/* ========== PRESENTATION MODE (one slide at a time + fullscreen) ========== */
const fsBtn=document.getElementById('fsBtn');
const presentCounter=document.getElementById('presentCounter');
let presentIdx=0;
function showPresentSlide(i){
  const all=document.querySelectorAll('.slide');
  presentIdx=Math.max(0,Math.min(all.length-1,i));
  all.forEach((s,k)=>s.classList.toggle('active',k===presentIdx));
  presentCounter.textContent=`${presentIdx+1} / ${all.length}`;
}
function enterPresent(){
  document.body.classList.add('presenting');
  // figure out which slide is currently in viewport (or 0)
  let inView=0;
  const vh=window.innerHeight;
  document.querySelectorAll('.slide').forEach((s,k)=>{
    const r=s.getBoundingClientRect();
    if(r.top<vh*.6 && r.bottom>vh*.4) inView=k;
  });
  showPresentSlide(inView);
  const fsEl=document.documentElement;
  try{
    if(fsEl.requestFullscreen) fsEl.requestFullscreen().catch(()=>{});
    else if(fsEl.webkitRequestFullscreen) fsEl.webkitRequestFullscreen();
  }catch(e){}
  fsBtn.textContent='⤡ 종료 (ESC)';
}
function exitPresent(){
  document.body.classList.remove('presenting');
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
  try{
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else if(document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  }catch(e){}
  fsBtn.textContent='▶ 프리젠테이션';
}
fsBtn.addEventListener('click',()=>{
  if(document.body.classList.contains('presenting'))exitPresent();
  else enterPresent();
});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{
  const fs=document.fullscreenElement||document.webkitFullscreenElement;
  if(!fs && document.body.classList.contains('presenting'))exitPresent();
}));
document.getElementById('lockBtn').addEventListener('click',()=>{exitPresent();lockGate()});
document.addEventListener('keydown',e=>{
  const ae=document.activeElement, tag=ae.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||ae.isContentEditable)return;
  if(e.key.toLowerCase()==='f' && !e.metaKey && !e.ctrlKey){e.preventDefault();fsBtn.click();return}
  if(document.body.classList.contains('presenting')){
    if(e.key==='Escape'){e.preventDefault();exitPresent()}
    else if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '||e.key==='PageDown'){e.preventDefault();showPresentSlide(presentIdx+1)}
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();showPresentSlide(presentIdx-1)}
    else if(e.key==='Home'){e.preventDefault();showPresentSlide(0)}
    else if(e.key==='End'){e.preventDefault();showPresentSlide(999)}
  }
});

const hud=document.getElementById('hud');
let _hudIO=null;
// rebuildable so added/deleted custom slides stay in sync (HUD dots + observer)
function rebuildHud(){
  hud.innerHTML='';
  const slides=[...document.querySelectorAll('.slide')];
  slides.forEach((s,i)=>{
    if(!s.id) s.id='cs-'+i;
    const a=document.createElement('a');
    a.href='#'+s.id; a.title='Slide '+(i+1);
    hud.appendChild(a);
  });
  const dots=[...hud.children];
  if(_hudIO) _hudIO.disconnect();
  _hudIO=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        const i=slides.indexOf(e.target);
        dots.forEach(d=>d.classList.remove('on'));
        if(dots[i]) dots[i].classList.add('on');
      }
    });
  },{threshold:.55});
  slides.forEach(s=>_hudIO.observe(s));
}
rebuildHud();

// keyboard scroll nav (only when NOT presenting) — queries slides live
let cur=0;
document.addEventListener('keydown',e=>{
  if(document.body.classList.contains('presenting'))return;
  if(document.body.classList.contains('editing'))return;
  const ae=document.activeElement, tag=ae.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||ae.isContentEditable)return;
  const slides=[...document.querySelectorAll('.slide')];
  if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key===' '){
    e.preventDefault();cur=Math.min(slides.length-1,cur+1);
    slides[cur].scrollIntoView({behavior:'smooth',block:'center'});
  }else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){
    e.preventDefault();cur=Math.max(0,cur-1);
    slides[cur].scrollIntoView({behavior:'smooth',block:'center'});
  }else if(e.key==='Home'){cur=0;slides[0].scrollIntoView({behavior:'smooth'});}
  else if(e.key==='End'){cur=slides.length-1;slides[cur].scrollIntoView({behavior:'smooth'});}
});

/* ========== EDIT MODE + PERSISTENCE + ONE-CLICK PDF ========== */
(function(){
  const TEXT_KEY='nag-edit-text-v1';
  const IDB_NAME='nag-edits', IDB_STORE='img';
  const deck=document.querySelector('.deck');
  if(!deck) return;

  /* ---- secret unlock: edit controls appear only with ?edit=<key> (or #<key>) ----
     nag-edit = 작성자 풀편집 / nag-am = AM 모드(표준 장표 잠금, 커스텀 장표만 편집) */
  const EDIT_KEY='nag-edit', AM_KEY='nag-am', CUSTOM_KEY='nag-custom-v1';
  const urlKey = new URLSearchParams(location.search).get('edit') || location.hash.replace('#','');
  const amMode = urlKey===AM_KEY;
  const editEnabled = amMode || urlKey===EDIT_KEY;
  if(editEnabled) document.body.classList.add('edit-enabled');
  if(amMode) document.body.classList.add('am-mode');

  function isLocked(el){ return amMode && !el.closest('.slide[data-custom]'); }

  /* ---- collect editable text leaves (text node only, or with <br>) ---- */
  const SKIP=new Set(['SCRIPT','STYLE','BUTTON','INPUT','TEXTAREA','IMG','BR']);
  function isTextLeaf(el){
    if(SKIP.has(el.tagName)) return false;
    if(el.closest('svg')) return false;
    if(el.closest('.ph-fallback')||el.closest('.cover-ph-fallback')) return false;
    if(el.closest('.slide-ctrls')||el.classList.contains('lock-badge')||el.classList.contains('cust-ph')) return false;
    if(!el.textContent.trim()) return false;

      if(n.nodeType===1 && n.tagName!=='BR') return false; // has a non-<br> element child
    }

  }

  /* ---- text persistence (standard slides → eid map; custom slides → snapshot) ---- */
  function loadTextMap(){ try{return JSON.parse(localStorage.getItem(TEXT_KEY)||'{}')}catch(e){return {}} }
  const textMap=loadTextMap();
  let saveTimer=null;
  function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(TEXT_KEY, JSON.stringify(textMap)); }catch(e){ console.warn('text save failed',e); }
  },400); }
  let eidCounter=0;
  function wireTextLeaf(el){
    el.dataset.eid='t'+(eidCounter++);
    el.addEventListener('input',()=>{
      if(!editing) return;
      if(el.closest('.slide[data-custom]')) scheduleCustomSave();
      else { textMap[el.dataset.eid]=el.innerHTML; scheduleSave(); }

  }
  // initial collection: STANDARD slides only (custom slides handled via enhanceCustomSlide)
  const textEls=[];
  deck.querySelectorAll('*').forEach(el=>{ if(isTextLeaf(el) && !el.closest('.slide[data-custom]')) textEls.push(el); });
  textEls.forEach(el=>{ wireTextLeaf(el); const v=textMap[el.dataset.eid]; if(v!=null) el.innerHTML=v; });

  /* ---- IndexedDB for images ---- */
  function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  function idbSet(k,v){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
  function idbAll(){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readonly'); const st=tx.objectStore(IDB_STORE); const kq=st.getAllKeys(), vq=st.getAll(); tx.oncomplete=()=>res({keys:kq.result,vals:vq.result}); tx.onerror=()=>rej(tx.error); })); }
  function idbClear(){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).clear(); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }

  /* ---- editable images ---- */
  let ieidCounter=0;

  }
  const fileInput=document.createElement('input');
  fileInput.type='file'; fileInput.accept='image/*'; fileInput.style.display='none';
  document.body.appendChild(fileInput);
  let pendingImg=null;
  function wireImage(img){
    if(!img.dataset.ieid) img.dataset.ieid='i'+(ieidCounter++);
    const host=img.parentNode; if(!host) return;
    host.classList.add('img-editable');
    host.addEventListener('click',e=>{
      if(!editing) return;

      e.preventDefault(); e.stopPropagation();
      pendingImg=img; fileInput.value=''; fileInput.click();
    });
  }
  fileInput.addEventListener('change',()=>{
    const f=fileInput.files&&fileInput.files[0]; if(!f||!pendingImg) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const url=rd.result, img=pendingImg; pendingImg=null;
      applyImg(img,url);

      else idbSet(img.dataset.ieid,url).catch(err=>alert('이미지 저장에 실패했습니다: '+err.message));
    };

  });
  // initial standard images (custom-slide images wired in enhanceCustomSlide)
  const imgEls=[...deck.querySelectorAll('img.mock-img, img.aichi-logo, img.aichi-img')].filter(img=>!img.closest('.slide[data-custom]'));
  imgEls.forEach(wireImage);
  if(window.indexedDB){
    idbAll().then(({keys,vals})=>{ keys.forEach((k,i)=>{ const img=deck.querySelector('[data-ieid="'+k+'"]'); if(img) applyImg(img,vals[i]); }); }).catch(()=>{});
  }

  /* ---- custom slide builder (add / delete / move / persist) ---- */
  function enhanceCustomSlide(slide){
    slide.dataset.custom='1';
    slide.querySelectorAll('*').forEach(el=>{ if(isTextLeaf(el) && !el.dataset.eid) wireTextLeaf(el); });
    slide.querySelectorAll('img.mock-img, img.aichi-logo, img.aichi-img').forEach(wireImage);
    slide.querySelectorAll('table.tbl').forEach(wireTable);   // editable price table (add/delete rows + auto TOTAL)
    if(!slide.querySelector(':scope > .slide-ctrls')){
      const c=document.createElement('div'); c.className='slide-ctrls';
      c.innerHTML='<button class="sc-up" type="button" title="위로">↑</button><button class="sc-down" type="button" title="아래로">↓</button><button class="sc-del" type="button" title="삭제">🗑</button>';

  let pendingInsertBefore=null;   // target slide to insert before (null = before the closing slide)

  function deleteCustom(slide){

  }
  function moveCustom(slide,dir){
    const slides=[...deck.querySelectorAll('.slide')];
    const i=slides.indexOf(slide), j=i+dir;

  // insert zones: "＋ 여기에 추가" affordance between slides (edit mode only)
  function refreshInsertZones(){
    deck.querySelectorAll('.insert-zone').forEach(z=>z.remove());

    const slides=[...deck.querySelectorAll('.slide')];
    const mkZone=(beforeEl)=>{
      const z=document.createElement('div'); z.className='insert-zone';
      const btn=document.createElement('button'); btn.type='button'; btn.className='iz-btn'; btn.textContent='＋ 슬라이드 추가하기';

      z.appendChild(btn);

    };
    slides.forEach(s=>deck.insertBefore(mkZone(s), s));   // a zone before each slide

  /* ---- editable price table (inline row add/delete + auto TOTAL) ---- */
  function parseNum(s){ const n=parseInt(String(s).replace(/[^\d]/g,''),10); return isNaN(n)?0:n; }
  function recomputeTotal(table){
    const sumRow=table.querySelector('tr.sum'); if(!sumRow) return;
    let sUnit=0, sImp=0;
    table.querySelectorAll('tbody tr').forEach(tr=>{
      if(tr.classList.contains('sum')||tr.classList.contains('price')) return;
      const td=tr.querySelectorAll('td');
      if(td.length>=5){ sUnit+=parseNum(td[3].textContent); sImp+=parseNum(td[4].textContent); }
    });
    const st=sumRow.querySelectorAll('td'); // [TOTAL(colspan2)][구좌][단가][노출수]
    if(st.length>=4){ st[2].textContent=sUnit?sUnit.toLocaleString('en'):'—'; st[3].textContent=sImp?sImp.toLocaleString('en'):'—'; }
  }
  function addRowDel(tr,table){
    const last=tr.lastElementChild; if(!last||last.querySelector('.rowdel')) return;
    last.style.position='relative';

    b.addEventListener('click',ev=>{ ev.stopPropagation(); tr.remove(); recomputeTotal(table); scheduleCustomSave(); });
    last.appendChild(b);
  }
  function addRow(table){
    const tb=table.querySelector('tbody'); if(!tb) return;
    const sumRow=table.querySelector('tr.sum');
    const tr=document.createElement('tr');
    tr.innerHTML='<td>영역</td><td>지면</td><td>1</td><td>—</td><td>—</td>';
    tb.insertBefore(tr, sumRow||null);
    tr.querySelectorAll('td').forEach(td=>{ if(isTextLeaf(td)) wireTextLeaf(td); });
    if(editing) tr.querySelectorAll('[data-eid]').forEach(td=>td.setAttribute('contenteditable','true'));
    addRowDel(tr,table);

  }
  function wireTable(table){
    if(table.dataset.wired) return; table.dataset.wired='1';
    // TOTAL 단가/노출수 cells are auto-computed → not directly editable
    const sumRow=table.querySelector('tr.sum');

    table.addEventListener('input',()=>recomputeTotal(table)); // live re-sum on any cell edit
    table.querySelectorAll('tbody tr').forEach(tr=>{ if(!tr.classList.contains('sum')&&!tr.classList.contains('price')) addRowDel(tr,table); });
    if(!(table.nextElementSibling&&table.nextElementSibling.classList.contains('addrow-btn'))){
      const btn=document.createElement('button'); btn.type='button'; btn.className='addrow-btn'; btn.textContent='＋ 행 추가';
      btn.addEventListener('click',ev=>{ ev.stopPropagation(); addRow(table); });
      table.insertAdjacentElement('afterend', btn);

  function cleanCustomClone(slide){
    const c=slide.cloneNode(true);
    c.querySelectorAll('.rowdel,.addrow-btn').forEach(e=>e.remove());
    c.querySelectorAll('[data-wired]').forEach(e=>e.removeAttribute('data-wired'));
    c.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
    c.querySelectorAll('[data-eid]').forEach(e=>e.removeAttribute('data-eid'));
    c.querySelectorAll('[data-ieid]').forEach(e=>e.removeAttribute('data-ieid'));

    c.querySelectorAll('.img-editable').forEach(e=>e.classList.remove('img-editable'));
    c.removeAttribute('data-scratch'); c.classList.remove('active');
    return c;
  }
  let customTimer=null;
  function snapshotCustom(){
    const out=[];

      while(n){ if(n.classList.contains('slide') && !n.dataset.custom){ beforeId=n.id; break; } n=n.nextElementSibling; }
      out.push({beforeId, html: cleanCustomClone(s).outerHTML});

  }
  function scheduleCustomSave(){ clearTimeout(customTimer); customTimer=setTimeout(snapshotCustom,400); }
  function restoreCustom(){
    let saved; try{ saved=JSON.parse(localStorage.getItem(CUSTOM_KEY)||'[]'); }catch(e){ return; }
    if(!Array.isArray(saved)) return;
    saved.forEach(({beforeId,html})=>{
      const tmp=document.createElement('div'); tmp.innerHTML=(html||'').trim();
      const node=tmp.firstElementChild; if(!node) return;
      node.dataset.scratch='1';
      let ref = beforeId ? deck.querySelector('#'+(window.CSS&&CSS.escape?CSS.escape(beforeId):beforeId)) : null;
      if(!ref){ const slides=deck.querySelectorAll('.slide'); ref=slides[slides.length-1]||null; }

      enhanceCustomSlide(node);
    });
  }

  /* ---- edit mode toggle ---- */
  let editing=false;
  const editBtn=document.getElementById('editBtn');
  function setEditing(on){
    editing=on;
    document.body.classList.toggle('editing',on);
    editBtn.classList.toggle('on',on);
    editBtn.textContent= on ? '✓ 수정완료' : '✏️ 수정';

      else el.removeAttribute('contenteditable');
    });
    if(on && palette) palette.hidden=true;
    refreshInsertZones();
  }
  // finishing edit (수정완료) auto-downloads the deployable HTML; starting just turns it on
  function toggleEdit(){
    if(!editEnabled) return;
    if(editing) exportHTML();   // exportHTML turns editing off + bakes edits + downloads
    else setEditing(true);
  }
  editBtn.addEventListener('click',toggleEdit);
  // E key toggles (only when secretly unlocked, not typing / not presenting)
  document.addEventListener('keydown',e=>{

  /* ---- reset all edits ---- */
  document.getElementById('resetBtn').addEventListener('click',()=>{

  /* ---- 📌 수정요청(annotation) 모드: 클릭한 요소에 메모 → Claude용 요청 목록 복사 ---- */
  const ANNOT_KEY='nag-annot-v1';
  const annotBtn=document.getElementById('annotBtn');
  let annotating=false, annots=[];
  try{ annots=JSON.parse(localStorage.getItem(ANNOT_KEY)||'[]'); if(!Array.isArray(annots)) annots=[]; }catch(e){ annots=[]; }
  const annotSave=()=>{ try{ localStorage.setItem(ANNOT_KEY,JSON.stringify(annots)); }catch(e){} };
  const annotPanel=document.createElement('div');
  annotPanel.className='annot-panel';
  annotPanel.innerHTML='<b>📌 수정요청</b> <span class="ap-cnt"></span><div class="ap-list"></div><div class="ap-btns"><button class="ap-copy">📋 요청 복사</button><button class="ap-clear">🗑 비우기</button></div><div style="opacity:.55;margin-top:6px">장표의 아무 영역이나 클릭 → 메모 입력. 복사해서 Claude에게 붙여넣으면 그 위치를 정확히 고칩니다.</div>';
  document.body.appendChild(annotPanel);
  function annotPath(el,root){
    const parts=[];
    while(el&&el!==root&&el.parentElement){
      const p=el.parentElement, tag=el.tagName.toLowerCase();
      const cls=(typeof el.className==='string'&&el.className.trim())?'.'+el.className.trim().split(/\s+/)[0]:'';
      const sibs=[...p.children].filter(c=>c.tagName===el.tagName);
      parts.unshift(sibs.length>1?tag+cls+':nth-of-type('+(sibs.indexOf(el)+1)+')':tag+cls);
      el=p;
    }
    return parts.join(' > ');
  }
  function annotRender(){

      slide.appendChild(pin);

    annotPanel.querySelector('.ap-cnt').textContent=annots.length+'건';
    annotPanel.querySelector('.ap-list').innerHTML=annots.map((a,i)=>'<div class="ap-item"><b>'+(i+1)+'.</b> ['+a.slide+'] '+a.memo.replace(/</g,'&lt;').slice(0,48)+'</div>').join('')||'<div style="opacity:.5">아직 요청이 없습니다</div>';
  }
  function setAnnotating(on){

  annotPanel.querySelector('.ap-clear').addEventListener('click',()=>{
    if(!annots.length) return;

  /* ---- export a deployable, ENCRYPTED index.html with edits baked in ---- */
  async function exportHTML(){
    if(editing) setEditing(false); // strip contenteditable + editing class from live DOM first
    const curPw=sessionStorage.getItem('nag-pw');
    if(!curPw){ alert('암호화 비밀번호를 찾을 수 없습니다.\n다시 비밀번호를 입력해 접속한 뒤 저장해주세요.'); return; }
    // 새 비밀번호로 저장할지 묻는다 (광고주별 덱 분리용). [취소]=저장 중단, 빈칸=기존 유지.
    const np=prompt('이 파일을 열 때 쓸 비밀번호를 정하세요.\n\n• 기존 비밀번호 그대로 → 빈칸으로 두고 [확인]\n• 광고주별로 분리 → 새 비밀번호 입력 후 [확인]\n\n⚠️ 비밀번호를 잊으면 이 파일을 다시 열 수 없습니다.','');
    if(np===null) return; // 취소 → 저장 안 함
    const pw=np.trim()?np.trim():curPw;
    const pwChanged=pw!==curPw;
    const exportBtn=document.getElementById('exportBtn');
    const prev=exportBtn?exportBtn.textContent:'';
    if(exportBtn){ exportBtn.disabled=true; exportBtn.textContent='암호화 중…'; }
    try{
      // 1) 현재 편집된 deck 마크업 정리 (편집 흔적 제거, 단 data-custom은 유지해 재편집 때 인식)
      const deckClone=deck.cloneNode(true);
      deckClone.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
      deckClone.querySelectorAll('.slide.active').forEach(e=>e.classList.remove('active'));
      deckClone.querySelectorAll('[data-eid]').forEach(e=>e.removeAttribute('data-eid'));
      deckClone.querySelectorAll('[data-ieid]').forEach(e=>e.removeAttribute('data-ieid'));
      deckClone.querySelectorAll('[data-scratch]').forEach(e=>e.removeAttribute('data-scratch'));
      deckClone.querySelectorAll('[data-wired]').forEach(e=>e.removeAttribute('data-wired'));
      deckClone.querySelectorAll('.slide-ctrls,.lock-badge,.insert-zone,.rowdel,.addrow-btn,.annot-pin').forEach(e=>e.remove());
      deckClone.querySelectorAll('.img-editable').forEach(e=>e.classList.remove('img-editable'));
      const deckHTML=deckClone.innerHTML;
      // 2) 암호화 (텍스트 + 교체 이미지 data URL까지 ciphertext 안으로)
      const enc=await encryptDeck(pw,deckHTML);
      // 3) 발행 문서 조립 — deck은 비우고 ENC 블록만 새 값으로 교체 (평문 절대 미포함)
      const clone=document.documentElement.cloneNode(true);
      const b=clone.querySelector('body'); if(b) b.classList.remove('editing','presenting','edit-enabled','annotating');
      clone.querySelectorAll('.annot-panel,.annot-pin').forEach(e=>e.remove());
      clone.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
      const cd=clone.querySelector('.deck'); if(cd) cd.innerHTML='';
      clone.querySelectorAll('input[type="file"]').forEach(e=>e.remove());               // drop hidden picker
      clone.querySelectorAll('script[src*="html2canvas"],script[src*="jspdf"]').forEach(e=>e.remove()); // drop lazy-loaded libs
      let html='<!doctype html>\n'+clone.outerHTML;
      const repl='/*ENC-START*/const ENC_SALT="'+enc.salt+'",ENC_IV="'+enc.iv+'",ENC_DATA="'+enc.data+'";/*ENC-END*/';
      html=html.replace(/\/\*ENC-START\*\/[\s\S]*?\/\*ENC-END\*\//, ()=>repl); // 함수 치환: base64의 $ 오해석 방지
      const blob=new Blob([html],{type:'text/html;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='index.html'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
      // 추가한 장표는 이제 파일에 구워졌으므로 스크래치 버퍼 정리 (재로드 시 중복 방지)
      deck.querySelectorAll('.slide[data-custom]').forEach(s=>delete s.dataset.scratch);
      localStorage.removeItem(CUSTOM_KEY);
      alert('수정완료. 편집 내용을 암호화한 index.html을 다운로드했습니다.\n\n🔑 이 파일의 비밀번호: '+pw+(pwChanged?'   ← 새 비밀번호로 변경됨!':'   (기존과 동일)')+'\n\n이 파일을 원하는 곳에 올리면(push/호스팅) 위 비밀번호로만 열립니다.\n소스 보기를 해도 단가/내용은 암호문으로만 보입니다.');
    }catch(err){
      alert('암호화 저장 중 문제가 발생했습니다.\n'+(err&&err.message?err.message:err));
    }finally{
      if(exportBtn){ exportBtn.disabled=false; exportBtn.textContent=prev; }
    }
  }
  document.getElementById('exportBtn').addEventListener('click',exportHTML);

  /* ========== ONE-CLICK PDF DOWNLOAD ========== */
  const pdfBtn=document.getElementById('pdfBtn');
  function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('스크립트 로드 실패: '+src)); document.head.appendChild(s); }); }
  let libsReady=false;
  async function ensureLibs(){
    if(libsReady) return;
    await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
    libsReady=true;
  }
  pdfBtn.addEventListener('click',async()=>{
    if(editing) setEditing(false);
    if(document.body.classList.contains('presenting') && typeof exitPresent==='function') exitPresent();
    const orig=pdfBtn.textContent; pdfBtn.disabled=true;
    try{
      pdfBtn.textContent='PDF 준비 중…';
      await ensureLibs();
      const jsPDF=window.jspdf.jsPDF;
      const all=[...document.querySelectorAll('.slide')];
      let pdf=null;
      for(let i=0;i<all.length;i++){
        pdfBtn.textContent='PDF 생성 중 '+(i+1)+'/'+all.length+'…';
        const canvas=await html2canvas(all[i],{
          scale:2, useCORS:true, backgroundColor:null, logging:false,
          width:1600, height:900, windowWidth:1600,
          onclone:(doc)=>{
            doc.querySelectorAll('.slide').forEach(s=>{ s.style.borderRadius='0'; s.style.boxShadow='none'; });
            doc.querySelectorAll('.annot-pin').forEach(e=>e.remove());
            // html2canvas can't render gradient text (background-clip:text) → force a solid fill so glyphs are visible
            const solidFill=(sel,color)=>doc.querySelectorAll(sel).forEach(e=>{
              e.style.background='none'; e.style.backgroundImage='none';
              e.style.webkitBackgroundClip='initial'; e.style.backgroundClip='initial';
              e.style.webkitTextFillColor=color; e.style.color=color;
            });
            solidFill('.s1 h1 .big:last-child, .s-div h1 em, .s14 .left .name, .s15 .left .name, .s16 h2 em', '#e6c46a');
            solidFill('.s3 .row .num, .s4 h2 em, .s14 .right h2 em', '#d2372f');
            solidFill('.pk-silver .left .name', '#a9a9a9');
            solidFill('.pk-bronze .left .name', '#b87333');
            solidFill('.pk-video .left .name', '#d2372f');
            solidFill('.pk-clip .left .name', '#6b6fae');
          }
        });
        const data=canvas.toDataURL('image/jpeg',0.92);
        const w=canvas.width, h=canvas.height;     // page size = exact canvas pixels → zero margin
        if(i===0) pdf=new jsPDF({orientation:'landscape',unit:'px',format:[w,h]});
        else pdf.addPage([w,h],'landscape');
        pdf.addImage(data,'JPEG',0,0,w,h);          // fill the entire page edge-to-edge
      }
      pdf.save('2026_AsianGames_AichiNagoya_NaverPremium.pdf');
    }catch(err){
      alert('PDF 생성 중 문제가 발생했습니다.\n'+(err&&err.message?err.message:err)+'\n\n대안: 키보드 Cmd+P(Mac) / Ctrl+P(Win) → "PDF로 저장"을 사용해 주세요.');
    }finally{
      pdfBtn.disabled=false; pdfBtn.textContent=orig;
    }
  });

  /* ========== SLIDE BUILDER INIT (palette + lock badges + custom slides) ========== */
  const addBtn=document.getElementById('addBtn');
  const palette=document.getElementById('palette');
  if(addBtn) addBtn.addEventListener('click',()=>{ if(editing && palette){ pendingInsertBefore=null; palette.hidden=false; } });
  if(palette){
    palette.querySelectorAll('.palette-item').forEach(b=>{
      b.addEventListener('click',()=>{
        palette.hidden=true;
        const ref=pendingInsertBefore;          // freeze target (multi-insert keeps order before same ref)
        b.dataset.tpl.split(',').forEach(t=>addCustomSlide(t.trim(), ref));
        pendingInsertBefore=null;
      });
    });
    const pc=document.getElementById('paletteCancel'); if(pc) pc.addEventListener('click',()=>palette.hidden=true);
    palette.addEventListener('click',e=>{ if(e.target===palette) palette.hidden=true; });
  }
  // AM mode: stamp a lock badge on every standard slide
  if(amMode){
    deck.querySelectorAll('.slide:not([data-custom])').forEach(s=>{
      if(!s.querySelector(':scope > .lock-badge')){
        const lb=document.createElement('div'); lb.className='lock-badge'; lb.textContent='🔒 표준 장표 — 수정 불가';
        s.appendChild(lb);
      }
    });
  }
  // enhance custom slides already baked into the deck, then restore scratch (unsaved) ones
  deck.querySelectorAll('.slide[data-custom]').forEach(enhanceCustomSlide);
  restoreCustom();
  rebuildHud();
})();

/* ====== Counter animation on KPI numbers ====== */
function getFirstTextNode(el){
  for(const n of el.childNodes){
    if(n.nodeType===Node.TEXT_NODE && n.textContent.trim()) return n;
  }
  return null;
}
function easeOutCubic(t){return 1-Math.pow(1-t,3)}
function animateNumberNode(textNode,raw){
  // Parse target value (handles 1.77, 2,830, 36.1, 191, 46, 1.5, 4,600 etc.)
  const cleaned=raw.replace(/,/g,'');
  const target=parseFloat(cleaned);
  if(isNaN(target)) return;
  const hasComma=/,/.test(raw);
  const decimals=(cleaned.split('.')[1]||'').length;
  const dur=1600;
  const start=performance.now();
  function step(now){
    const t=Math.min(1,(now-start)/dur);
    const v=target*easeOutCubic(t);
    let s=decimals>0?v.toFixed(decimals):Math.round(v).toString();
    if(hasComma){
      const parts=s.split('.');
      parts[0]=parseFloat(parts[0]).toLocaleString('en');
      s=parts.join('.');
    }
    textNode.textContent=s;
    if(t<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
const counterTargets=document.querySelectorAll('.s6 .stat .num, .s2 .right .card .val');
counterTargets.forEach(el=>{
  const tn=getFirstTextNode(el);
  if(!tn) return;
  const raw=tn.textContent.trim();
  if(!/^[\d,.]+$/.test(raw)) return;
  el.dataset.target=raw;
  tn.textContent='0';
});
const counterIO=new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(e.isIntersecting){
      const tn=getFirstTextNode(e.target);
      if(tn && e.target.dataset.target) animateNumberNode(tn,e.target.dataset.target);
      counterIO.unobserve(e.target);
    }
  });
},{threshold:.4});
counterTargets.forEach(el=>counterIO.observe(el));

/* ====== Confetti burst on click (celebration for cover/closing) ====== */
function confettiBurst(x,y){
  const colors=['#d5b200','#d2372f','#4e3a93','#19aea9','#07993F','#FFEC8D'];
  const N=24;
  for(let i=0;i<N;i++){
    const c=document.createElement('div');
    c.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:10px;height:14px;background:${colors[i%colors.length]};border-radius:2px;pointer-events:none;z-index:9999;will-change:transform,opacity`;
    document.body.appendChild(c);
    const ang=(i/N)*Math.PI*2;
    const vel=140+Math.random()*120;
    const dx=Math.cos(ang)*vel;
    const dy=Math.sin(ang)*vel-80;
    c.animate(
      [{transform:'translate(0,0) rotate(0deg)',opacity:1},
       {transform:`translate(${dx}px,${dy+400}px) rotate(${720*Math.random()-360}deg)`,opacity:0}],
      {duration:1200+Math.random()*400,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'}
    ).onfinish=()=>c.remove();
  }
}
document.querySelectorAll('.s1 h1, .s18 h1, .aichi-emblem').forEach(el=>{
  el.style.cursor='pointer';
  el.addEventListener('click',e=>{
    if(document.body.classList.contains('editing'))return; // editing takes priority
    confettiBurst(e.clientX,e.clientY);
  });
});

/* ====== Parallax tilt on cover emblem ====== */
const emblem=document.querySelector('.s1 .emblem-side');
if(emblem){
  const cover=document.querySelector('#s1');
  cover.addEventListener('mousemove',e=>{
    const r=cover.getBoundingClientRect();
    const dx=((e.clientX-r.left)/r.width-.5)*8;
    const dy=((e.clientY-r.top)/r.height-.5)*8;
    emblem.style.transform=`translateY(-50%) translate(${dx}px,${dy}px) rotateY(${dx*.4}deg) rotateX(${-dy*.4}deg)`;
  });
  cover.addEventListener('mouseleave',()=>{emblem.style.transform='translateY(-50%)'});
}
} /* ===== end initDeck ===== */
