/* ========== DECK INIT (runs after decryption injects the slides) ========== */
function initDeck(){

/* ========== PRESENTATION MODE (one slide at a time + fullscreen) ========== */
const fsBtn=document.getElementById('fsBtn');
const presentCounter=document.getElementById('presentCounter');
let presentIdx=0;
function showPresentSlide(i){
  const all=document.querySelectorAll('.slide');
  presentIdx=Math.max(0,Math.min(all.length-1,i));
  all.forEach((s,k)=>s.classList.toggle('active',k===presentIdx));
  presentCounter.textContent=`${presentIdx+1} / ${all.length}`;
}
function enterPresent(){
  document.body.classList.add('presenting');
  // figure out which slide is currently in viewport (or 0)
  let inView=0;
  const vh=window.innerHeight;
  document.querySelectorAll('.slide').forEach((s,k)=>{
    const r=s.getBoundingClientRect();
    if(r.top<vh*.6 && r.bottom>vh*.4) inView=k;
  });
  showPresentSlide(inView);
  const fsEl=document.documentElement;
  try{
    if(fsEl.requestFullscreen) fsEl.requestFullscreen().catch(()=>{});
    else if(fsEl.webkitRequestFullscreen) fsEl.webkitRequestFullscreen();
  }catch(e){}
  fsBtn.textContent='⤡ 종료 (ESC)';
}
function exitPresent(){
  document.body.classList.remove('presenting');
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
  try{
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    else if(document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  }catch(e){}
  fsBtn.textContent='▶ 프리젠테이션';
}
fsBtn.addEventListener('click',()=>{
  if(document.body.classList.contains('presenting'))exitPresent();
  else enterPresent();
});
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{
  const fs=document.fullscreenElement||document.webkitFullscreenElement;
  if(!fs && document.body.classList.contains('presenting'))exitPresent();
}));
document.getElementById('lockBtn').addEventListener('click',()=>{exitPresent();lockGate()});
document.addEventListener('keydown',e=>{
  const ae=document.activeElement, tag=ae.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||ae.isContentEditable)return;
  if(e.key.toLowerCase()==='f' && !e.metaKey && !e.ctrlKey){e.preventDefault();fsBtn.click();return}
  if(document.body.classList.contains('presenting')){
    if(e.key==='Escape'){e.preventDefault();exitPresent()}
    else if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '||e.key==='PageDown'){e.preventDefault();showPresentSlide(presentIdx+1)}
    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();showPresentSlide(presentIdx-1)}
    else if(e.key==='Home'){e.preventDefault();showPresentSlide(0)}
    else if(e.key==='End'){e.preventDefault();showPresentSlide(999)}
  }
});

const hud=document.getElementById('hud');
let _hudIO=null;
// rebuildable so added/deleted custom slides stay in sync (HUD dots + observer)
function rebuildHud(){
  hud.innerHTML='';
  const slides=[...document.querySelectorAll('.slide')];
  slides.forEach((s,i)=>{
    if(!s.id) s.id='cs-'+i;
    const a=document.createElement('a');
    a.href='#'+s.id; a.title='Slide '+(i+1);
    hud.appendChild(a);
  });
  const dots=[...hud.children];
  if(_hudIO) _hudIO.disconnect();
  _hudIO=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        const i=slides.indexOf(e.target);
        dots.forEach(d=>d.classList.remove('on'));
        if(dots[i]) dots[i].classList.add('on');
      }
    });
  },{threshold:.55});
  slides.forEach(s=>_hudIO.observe(s));
}
rebuildHud();

// keyboard scroll nav (only when NOT presenting) — queries slides live
let cur=0;
document.addEventListener('keydown',e=>{
  if(document.body.classList.contains('presenting'))return;
  if(document.body.classList.contains('editing'))return;
  const ae=document.activeElement, tag=ae.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA'||ae.isContentEditable)return;
  const slides=[...document.querySelectorAll('.slide')];
  if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key===' '){
    e.preventDefault();cur=Math.min(slides.length-1,cur+1);
    slides[cur].scrollIntoView({behavior:'smooth',block:'center'});
  }else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){
    e.preventDefault();cur=Math.max(0,cur-1);
    slides[cur].scrollIntoView({behavior:'smooth',block:'center'});
  }else if(e.key==='Home'){cur=0;slides[0].scrollIntoView({behavior:'smooth'});}
  else if(e.key==='End'){cur=slides.length-1;slides[cur].scrollIntoView({behavior:'smooth'});}
});

/* ========== EDIT MODE + PERSISTENCE + ONE-CLICK PDF ========== */
(function(){
  const TEXT_KEY='nag-edit-text-v1';
  const IDB_NAME='nag-edits', IDB_STORE='img';
  const deck=document.querySelector('.deck');
  if(!deck) return;

  /* ---- secret unlock: edit controls appear only with ?edit=<key> (or #<key>) ----
     nag-edit = 작성자 풀편집 / nag-am = AM 모드(표준 장표 잠금, 커스텀 장표만 편집) */
  const EDIT_KEY='nag-edit', AM_KEY='nag-am', CUSTOM_KEY='nag-custom-v1';
  const urlKey = new URLSearchParams(location.search).get('edit') || location.hash.replace('#','');
  const amMode = urlKey===AM_KEY;
  const editEnabled = amMode || urlKey===EDIT_KEY;
  if(editEnabled) document.body.classList.add('edit-enabled');
  if(amMode) document.body.classList.add('am-mode');
  // in AM mode a standard (non-custom) slide is locked
  function isLocked(el){ return amMode && !el.closest('.slide[data-custom]'); }

  /* ---- collect editable text leaves (text node only, or with <br>) ---- */
  const SKIP=new Set(['SCRIPT','STYLE','BUTTON','INPUT','TEXTAREA','IMG','BR']);
  function isTextLeaf(el){
    if(SKIP.has(el.tagName)) return false;
    if(el.closest('svg')) return false;
    if(el.closest('.ph-fallback')||el.closest('.cover-ph-fallback')) return false;
    if(el.closest('.slide-ctrls')||el.classList.contains('lock-badge')||el.classList.contains('cust-ph')) return false;
    if(!el.textContent.trim()) return false;
    for(const n of el.childNodes){
      if(n.nodeType===1 && n.tagName!=='BR') return false; // has a non-<br> element child
    }
    return true;
  }

  /* ---- text persistence (standard slides → eid map; custom slides → snapshot) ---- */
  function loadTextMap(){ try{return JSON.parse(localStorage.getItem(TEXT_KEY)||'{}')}catch(e){return {}} }
  const textMap=loadTextMap();
  let saveTimer=null;
  function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(TEXT_KEY, JSON.stringify(textMap)); }catch(e){ console.warn('text save failed',e); }
  },400); }
  let eidCounter=0;
  function wireTextLeaf(el){
    el.dataset.eid='t'+(eidCounter++);
    el.addEventListener('input',()=>{
      if(!editing) return;
      if(el.closest('.slide[data-custom]')) scheduleCustomSave();
      else { textMap[el.dataset.eid]=el.innerHTML; scheduleSave(); }
    });
  }
  // initial collection: STANDARD slides only (custom slides handled via enhanceCustomSlide)
  const textEls=[];
  deck.querySelectorAll('*').forEach(el=>{ if(isTextLeaf(el) && !el.closest('.slide[data-custom]')) textEls.push(el); });
  textEls.forEach(el=>{ wireTextLeaf(el); const v=textMap[el.dataset.eid]; if(v!=null) el.innerHTML=v; });

  /* ---- IndexedDB for images ---- */
  function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  function idbSet(k,v){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }
  function idbAll(){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readonly'); const st=tx.objectStore(IDB_STORE); const kq=st.getAllKeys(), vq=st.getAll(); tx.oncomplete=()=>res({keys:kq.result,vals:vq.result}); tx.onerror=()=>rej(tx.error); })); }
  function idbClear(){ return idb().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).clear(); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); })); }

  /* ---- editable images ---- */
  let ieidCounter=0;
  function applyImg(img,dataUrl){
    img.src=dataUrl; img.style.display='';
    if(img.parentNode) img.parentNode.classList.remove('no-img');
  }
  const fileInput=document.createElement('input');
  fileInput.type='file'; fileInput.accept='image/*'; fileInput.style.display='none';
  document.body.appendChild(fileInput);
  let pendingImg=null;
  function wireImage(img){
    if(!img.dataset.ieid) img.dataset.ieid='i'+(ieidCounter++);
    const host=img.parentNode; if(!host) return;
    host.classList.add('img-editable');
    host.addEventListener('click',e=>{
      if(!editing) return;
      if(isLocked(host)) return;          // AM mode: standard slide images locked
      e.preventDefault(); e.stopPropagation();
      pendingImg=img; fileInput.value=''; fileInput.click();
    });
  }
  fileInput.addEventListener('change',()=>{
    const f=fileInput.files&&fileInput.files[0]; if(!f||!pendingImg) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const url=rd.result, img=pendingImg; pendingImg=null;
      applyImg(img,url);
      if(img.closest('.slide[data-custom]')) scheduleCustomSave();   // custom imgs ride in the slide snapshot/ciphertext
      else idbSet(img.dataset.ieid,url).catch(err=>alert('이미지 저장에 실패했습니다: '+err.message));
    };
    rd.readAsDataURL(f);
  });
  // initial standard images (custom-slide images wired in enhanceCustomSlide)
  const imgEls=[...deck.querySelectorAll('img.mock-img, img.aichi-logo, img.aichi-img')].filter(img=>!img.closest('.slide[data-custom]'));
  imgEls.forEach(wireImage);
  if(window.indexedDB){
    idbAll().then(({keys,vals})=>{ keys.forEach((k,i)=>{ const img=deck.querySelector('[data-ieid="'+k+'"]'); if(img) applyImg(img,vals[i]); }); }).catch(()=>{});
  }

  /* ---- custom slide builder (add / delete / move / persist) ---- */
  function enhanceCustomSlide(slide){
    slide.dataset.custom='1';
    slide.querySelectorAll('*').forEach(el=>{ if(isTextLeaf(el) && !el.dataset.eid) wireTextLeaf(el); });
    slide.querySelectorAll('img.mock-img, img.aichi-logo, img.aichi-img').forEach(wireImage);
    slide.querySelectorAll('table.tbl').forEach(wireTable);   // editable price table (add/delete rows + auto TOTAL)
    if(!slide.querySelector(':scope > .slide-ctrls')){
      const c=document.createElement('div'); c.className='slide-ctrls';
      c.innerHTML='<button class="sc-up" type="button" title="위로">↑</button><button class="sc-down" type="button" title="아래로">↓</button><button class="sc-del" type="button" title="삭제">🗑</button>';
      c.querySelector('.sc-up').addEventListener('click',ev=>{ev.stopPropagation();moveCustom(slide,-1);});
      c.querySelector('.sc-down').addEventListener('click',ev=>{ev.stopPropagation();moveCustom(slide,1);});
      c.querySelector('.sc-del').addEventListener('click',ev=>{ev.stopPropagation();deleteCustom(slide);});
      slide.appendChild(c);
    }
    if(editing) slide.querySelectorAll('[data-eid]').forEach(el=>el.setAttribute('contenteditable','true'));
  }
  let pendingInsertBefore=null;   // target slide to insert before (null = before the closing slide)
  function addCustomSlide(tplId, beforeEl){
    const tpl=document.getElementById(tplId); if(!tpl) return;
    const node=tpl.content.firstElementChild.cloneNode(true);
    node.dataset.scratch='1';
    let ref=beforeEl;
    if(ref===undefined || ref===null){ const slides=deck.querySelectorAll('.slide'); ref=slides[slides.length-1]||null; } // default: before closing slide
    if(ref) deck.insertBefore(node,ref); else deck.appendChild(node);
    enhanceCustomSlide(node);
    rebuildHud(); refreshInsertZones();
    scheduleCustomSave();
    node.scrollIntoView({behavior:'smooth',block:'center'});
    return node;
  }
  function deleteCustom(slide){
    if(!confirm('이 장표를 삭제할까요?')) return;
    slide.remove(); rebuildHud(); refreshInsertZones(); scheduleCustomSave();
  }
  function moveCustom(slide,dir){
    const slides=[...deck.querySelectorAll('.slide')];
    const i=slides.indexOf(slide), j=i+dir;
    if(j<0||j>=slides.length) return;
    const ref=slides[j];
    deck.insertBefore(slide, dir<0?ref:ref.nextSibling);
    rebuildHud(); refreshInsertZones(); scheduleCustomSave();
    slide.scrollIntoView({behavior:'smooth',block:'center'});
  }
  // insert zones: "＋ 여기에 추가" affordance between slides (edit mode only)
  function refreshInsertZones(){
    deck.querySelectorAll('.insert-zone').forEach(z=>z.remove());
    if(!editing) return;
    const slides=[...deck.querySelectorAll('.slide')];
    const mkZone=(beforeEl)=>{
      const z=document.createElement('div'); z.className='insert-zone';
      const btn=document.createElement('button'); btn.type='button'; btn.className='iz-btn'; btn.textContent='＋ 슬라이드 추가하기';
      btn.addEventListener('click',ev=>{ ev.stopPropagation(); pendingInsertBefore=beforeEl; if(palette) palette.hidden=false; });
      z.appendChild(btn);
      return z;
    };
    slides.forEach(s=>deck.insertBefore(mkZone(s), s));   // a zone before each slide
    deck.appendChild(mkZone(null));                        // and one at the very end
  }
  /* ---- editable price table (inline row add/delete + auto TOTAL) ---- */
  function parseNum(s){ const n=parseInt(String(s).replace(/[^\d]/g,''),10); return isNaN(n)?0:n; }
  function recomputeTotal(table){
    const sumRow=table.querySelector('tr.sum'); if(!sumRow) return;
    let sUnit=0, sImp=0;
    table.querySelectorAll('tbody tr').forEach(tr=>{
      if(tr.classList.contains('sum')||tr.classList.contains('price')) return;
      const td=tr.querySelectorAll('td');
      if(td.length>=5){ sUnit+=parseNum(td[3].textContent); sImp+=parseNum(td[4].textContent); }
    });
    const st=sumRow.querySelectorAll('td'); // [TOTAL(colspan2)][구좌][단가][노출수]
    if(st.length>=4){ st[2].textContent=sUnit?sUnit.toLocaleString('en'):'—'; st[3].textContent=sImp?sImp.toLocaleString('en'):'—'; }
  }
  function addRowDel(tr,table){
    const last=tr.lastElementChild; if(!last||last.querySelector('.rowdel')) return;
    last.style.position='relative';
    const b=document.createElement('button'); b.type='button'; b.className='rowdel'; b.textContent='✕'; b.title='행 삭제';
    b.addEventListener('click',ev=>{ ev.stopPropagation(); tr.remove(); recomputeTotal(table); scheduleCustomSave(); });
    last.appendChild(b);
  }
  function addRow(table){
    const tb=table.querySelector('tbody'); if(!tb) return;
    const sumRow=table.querySelector('tr.sum');
    const tr=document.createElement('tr');
    tr.innerHTML='<td>영역</td><td>지면</td><td>1</td><td>—</td><td>—</td>';
    tb.insertBefore(tr, sumRow||null);
    tr.querySelectorAll('td').forEach(td=>{ if(isTextLeaf(td)) wireTextLeaf(td); });
    if(editing) tr.querySelectorAll('[data-eid]').forEach(td=>td.setAttribute('contenteditable','true'));
    addRowDel(tr,table);
    recomputeTotal(table); scheduleCustomSave();
  }
  function wireTable(table){
    if(table.dataset.wired) return; table.dataset.wired='1';
    // TOTAL 단가/노출수 cells are auto-computed → not directly editable
    const sumRow=table.querySelector('tr.sum');
    if(sumRow){ const t=sumRow.querySelectorAll('td'); [t[2],t[3]].forEach(td=>{ if(td){ td.removeAttribute('data-eid'); td.classList.add('auto'); } }); }
    table.addEventListener('input',()=>recomputeTotal(table)); // live re-sum on any cell edit
    table.querySelectorAll('tbody tr').forEach(tr=>{ if(!tr.classList.contains('sum')&&!tr.classList.contains('price')) addRowDel(tr,table); });
    if(!(table.nextElementSibling&&table.nextElementSibling.classList.contains('addrow-btn'))){
      const btn=document.createElement('button'); btn.type='button'; btn.className='addrow-btn'; btn.textContent='＋ 행 추가';
      btn.addEventListener('click',ev=>{ ev.stopPropagation(); addRow(table); });
      table.insertAdjacentElement('afterend', btn);
    }
    recomputeTotal(table);
  }

  function cleanCustomClone(slide){
    const c=slide.cloneNode(true);
    c.querySelectorAll('.rowdel,.addrow-btn').forEach(e=>e.remove());
    c.querySelectorAll('[data-wired]').forEach(e=>e.removeAttribute('data-wired'));
    c.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
    c.querySelectorAll('[data-eid]').forEach(e=>e.removeAttribute('data-eid'));
    c.querySelectorAll('[data-ieid]').forEach(e=>e.removeAttribute('data-ieid'));
    c.querySelectorAll('.slide-ctrls,.lock-badge').forEach(e=>e.remove());
    c.querySelectorAll('.img-editable').forEach(e=>e.classList.remove('img-editable'));
    c.removeAttribute('data-scratch'); c.classList.remove('active');
    return c;
  }
  let customTimer=null;
  function snapshotCustom(){
    const out=[];
    deck.querySelectorAll('.slide[data-custom][data-scratch]').forEach(s=>{
      let n=s.nextElementSibling, beforeId=null;
      while(n){ if(n.classList.contains('slide') && !n.dataset.custom){ beforeId=n.id; break; } n=n.nextElementSibling; }
      out.push({beforeId, html: cleanCustomClone(s).outerHTML});
    });
    try{ localStorage.setItem(CUSTOM_KEY, JSON.stringify(out)); }catch(e){ console.warn('custom save failed',e); }
  }
  function scheduleCustomSave(){ clearTimeout(customTimer); customTimer=setTimeout(snapshotCustom,400); }
  function restoreCustom(){
    let saved; try{ saved=JSON.parse(localStorage.getItem(CUSTOM_KEY)||'[]'); }catch(e){ return; }
    if(!Array.isArray(saved)) return;
    saved.forEach(({beforeId,html})=>{
      const tmp=document.createElement('div'); tmp.innerHTML=(html||'').trim();
      const node=tmp.firstElementChild; if(!node) return;
      node.dataset.scratch='1';
      let ref = beforeId ? deck.querySelector('#'+(window.CSS&&CSS.escape?CSS.escape(beforeId):beforeId)) : null;
      if(!ref){ const slides=deck.querySelectorAll('.slide'); ref=slides[slides.length-1]||null; }
      if(ref) deck.insertBefore(node,ref); else deck.appendChild(node);
      enhanceCustomSlide(node);
    });
  }

  /* ---- edit mode toggle ---- */
  let editing=false;
  const editBtn=document.getElementById('editBtn');
  function setEditing(on){
    editing=on;
    document.body.classList.toggle('editing',on);
    editBtn.classList.toggle('on',on);
    editBtn.textContent= on ? '✓ 수정완료' : '✏️ 수정';
    // query live so dynamically-added custom slides are included; AM mode leaves standard slides locked
    document.querySelectorAll('.deck [data-eid]').forEach(el=>{
      if(on && !isLocked(el)) el.setAttribute('contenteditable','true');
      else el.removeAttribute('contenteditable');
    });
    if(on && palette) palette.hidden=true;
    refreshInsertZones();
  }
  // finishing edit (수정완료) auto-downloads the deployable HTML; starting just turns it on
  function toggleEdit(){
    if(!editEnabled) return;
    if(editing) exportHTML();   // exportHTML turns editing off + bakes edits + downloads
    else setEditing(true);
  }
  editBtn.addEventListener('click',toggleEdit);
  // E key toggles (only when secretly unlocked, not typing / not presenting)
  document.addEventListener('keydown',e=>{
    if(!editEnabled) return;
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(document.body.classList.contains('presenting')) return;
    const t=document.activeElement;
    if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
    if(e.key.toLowerCase()==='e'){ e.preventDefault(); toggleEdit(); }
  });
  // leaving to presentation mode force-exits edit
  new MutationObserver(()=>{ if(document.body.classList.contains('presenting') && editing) setEditing(false); })
    .observe(document.body,{attributes:true,attributeFilter:['class']});

  /* ---- reset all edits ---- */
  document.getElementById('resetBtn').addEventListener('click',()=>{
    if(!confirm('수정한 모든 텍스트·이미지·추가한 장표를 지우고 원본으로 되돌릴까요?\n(이 브라우저에 저장된 편집 내용이 삭제됩니다)')) return;
    localStorage.removeItem(TEXT_KEY);
    localStorage.removeItem(CUSTOM_KEY);
    const done=()=>location.reload();
    if(window.indexedDB) idbClear().then(done).catch(done); else done();
  });

  /* ---- 📌 수정요청(annotation) 모드: 클릭한 요소에 메모 → Claude용 요청 목록 복사 ---- */
  const ANNOT_KEY='nag-annot-v1';
  const annotBtn=document.getElementById('annotBtn');
  let annotating=false, annots=[];
  try{ annots=JSON.parse(localStorage.getItem(ANNOT_KEY)||'[]'); if(!Array.isArray(annots)) annots=[]; }catch(e){ annots=[]; }
  const annotSave=()=>{ try{ localStorage.setItem(ANNOT_KEY,JSON.stringify(annots)); }catch(e){} };
  const annotPanel=document.createElement('div');
  annotPanel.className='annot-panel';
  annotPanel.innerHTML='<b>📌 수정요청</b> <span class="ap-cnt"></span><div class="ap-list"></div><div class="ap-btns"><button class="ap-copy">📋 요청 복사</button><button class="ap-clear">🗑 비우기</button></div><div style="opacity:.55;margin-top:6px">장표의 아무 영역이나 클릭 → 메모 입력. 복사해서 Claude에게 붙여넣으면 그 위치를 정확히 고칩니다.</div>';
  document.body.appendChild(annotPanel);
  function annotPath(el,root){
    const parts=[];
    while(el&&el!==root&&el.parentElement){
      const p=el.parentElement, tag=el.tagName.toLowerCase();
      const cls=(typeof el.className==='string'&&el.className.trim())?'.'+el.className.trim().split(/\s+/)[0]:'';
      const sibs=[...p.children].filter(c=>c.tagName===el.tagName);
      parts.unshift(sibs.length>1?tag+cls+':nth-of-type('+(sibs.indexOf(el)+1)+')':tag+cls);
      el=p;
    }
    return parts.join(' > ');
  }
  function annotRender(){
    document.querySelectorAll('.annot-pin').forEach(p=>p.remove());
    annots.forEach((a,i)=>{
      const slide=document.getElementById(a.slide); if(!slide) return;
      const pin=document.createElement('div'); pin.className='annot-pin'; pin.textContent=i+1;
      pin.style.left=a.x+'%'; pin.style.top=a.y+'%';
      slide.appendChild(pin);
    });
    annotPanel.querySelector('.ap-cnt').textContent=annots.length+'건';
    annotPanel.querySelector('.ap-list').innerHTML=annots.map((a,i)=>'<div class="ap-item"><b>'+(i+1)+'.</b> ['+a.slide+'] '+a.memo.replace(/</g,'&lt;').slice(0,48)+'</div>').join('')||'<div style="opacity:.5">아직 요청이 없습니다</div>';
  }
  function setAnnotating(on){
    annotating=on;
    document.body.classList.toggle('annotating',on);
    annotBtn.classList.toggle('on',on);
    annotBtn.textContent=on?'✓ 요청작성 종료':'📌 수정요청';
    if(on&&editing) setEditing(false);
    annotRender();
  }
  annotBtn.addEventListener('click',()=>setAnnotating(!annotating));
  document.addEventListener('click',e=>{
    if(!annotating) return;
    const t=e.target;
    if(t.closest('.toolbar')||t.closest('.annot-panel')||t.closest('.hud')) return;
    const slide=t.closest('.slide'); if(!slide||!slide.id) return;
    e.preventDefault(); e.stopPropagation();
    const cur=(t.textContent||'').trim().replace(/\s+/g,' ').slice(0,60);
    const memo=prompt('이 영역 수정요청 메모:'+(cur?'\n(선택: “'+cur+'”)':''));
    if(!memo||!memo.trim()) return;
    const sr=slide.getBoundingClientRect(), r=t.getBoundingClientRect();
    annots.push({slide:slide.id, path:annotPath(t,slide), eid:t.getAttribute('data-eid')||null,
      text:(t.textContent||'').trim().replace(/\s+/g,' ').slice(0,80), memo:memo.trim(),
      x:+(((r.left+r.width/2-sr.left)/sr.width*100).toFixed(2)),
      y:+(((r.top+r.height/2-sr.top)/sr.height*100).toFixed(2))});
    annotSave(); annotRender();
  },true);
  annotPanel.querySelector('.ap-copy').addEventListener('click',()=>{
    if(!annots.length){ alert('복사할 요청이 없습니다.'); return; }
    const txt='[아시안게임 덱 수정요청 '+annots.length+'건]\n'+annots.map((a,i)=>
      (i+1)+'. 슬라이드 #'+a.slide+' · 요소: '+a.path+(a.eid?' (eid:'+a.eid+')':'')+(a.text?' · 현재 텍스트: “'+a.text+'”':'')+'\n   → 요청: '+a.memo).join('\n');
    const done=()=>{ alert('복사 완료! Claude에게 그대로 붙여넣으면 됩니다.'); };
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(()=>{ window.prompt('아래 내용을 직접 복사하세요:',txt); });
    else window.prompt('아래 내용을 직접 복사하세요:',txt);
  });
  annotPanel.querySelector('.ap-clear').addEventListener('click',()=>{
    if(!annots.length) return;
    if(!confirm('수정요청 '+annots.length+'건을 모두 지울까요?')) return;
    annots=[]; annotSave(); annotRender();
  });
  annotRender();

  /* ---- export a deployable, ENCRYPTED index.html with edits baked in ---- */
  async function exportHTML(){
    if(editing) setEditing(false); // strip contenteditable + editing class from live DOM first
    const curPw=sessionStorage.getItem('nag-pw');
    if(!curPw){ alert('암호화 비밀번호를 찾을 수 없습니다.\n다시 비밀번호를 입력해 접속한 뒤 저장해주세요.'); return; }
    // 새 비밀번호로 저장할지 묻는다 (광고주별 덱 분리용). [취소]=저장 중단, 빈칸=기존 유지.
    const np=prompt('이 파일을 열 때 쓸 비밀번호를 정하세요.\n\n• 기존 비밀번호 그대로 → 빈칸으로 두고 [확인]\n• 광고주별로 분리 → 새 비밀번호 입력 후 [확인]\n\n⚠️ 비밀번호를 잊으면 이 파일을 다시 열 수 없습니다.','');
    if(np===null) return; // 취소 → 저장 안 함
    const pw=np.trim()?np.trim():curPw;
    const pwChanged=pw!==curPw;
    const exportBtn=document.getElementById('exportBtn');
    const prev=exportBtn?exportBtn.textContent:'';
    if(exportBtn){ exportBtn.disabled=true; exportBtn.textContent='암호화 중…'; }
    try{
      // 1) 현재 편집된 deck 마크업 정리 (편집 흔적 제거, 단 data-custom은 유지해 재편집 때 인식)
      const deckClone=deck.cloneNode(true);
      deckClone.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
      deckClone.querySelectorAll('.slide.active').forEach(e=>e.classList.remove('active'));
      deckClone.querySelectorAll('[data-eid]').forEach(e=>e.removeAttribute('data-eid'));
      deckClone.querySelectorAll('[data-ieid]').forEach(e=>e.removeAttribute('data-ieid'));
      deckClone.querySelectorAll('[data-scratch]').forEach(e=>e.removeAttribute('data-scratch'));
      deckClone.querySelectorAll('[data-wired]').forEach(e=>e.removeAttribute('data-wired'));
      deckClone.querySelectorAll('.slide-ctrls,.lock-badge,.insert-zone,.rowdel,.addrow-btn,.annot-pin').forEach(e=>e.remove());
      deckClone.querySelectorAll('.img-editable').forEach(e=>e.classList.remove('img-editable'));
      const deckHTML=deckClone.innerHTML;
      // 2) 암호화 (텍스트 + 교체 이미지 data URL까지 ciphertext 안으로)
      const enc=await encryptDeck(pw,deckHTML);
      // 3) 발행 문서 조립 — deck은 비우고 ENC 블록만 새 값으로 교체 (평문 절대 미포함)
      const clone=document.documentElement.cloneNode(true);
      const b=clone.querySelector('body'); if(b) b.classList.remove('editing','presenting','edit-enabled','annotating');
      clone.querySelectorAll('.annot-panel,.annot-pin').forEach(e=>e.remove());
      clone.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
      const cd=clone.querySelector('.deck'); if(cd) cd.innerHTML='';
      clone.querySelectorAll('input[type="file"]').forEach(e=>e.remove());               // drop hidden picker
      clone.querySelectorAll('script[src*="html2canvas"],script[src*="jspdf"]').forEach(e=>e.remove()); // drop lazy-loaded libs
      let html='<!doctype html>\n'+clone.outerHTML;
      const repl='/*ENC-START*/const ENC_SALT="'+enc.salt+'",ENC_IV="'+enc.iv+'",ENC_DATA="'+enc.data+'";/*ENC-END*/';
      html=html.replace(/\/\*ENC-START\*\/[\s\S]*?\/\*ENC-END\*\//, ()=>repl); // 함수 치환: base64의 $ 오해석 방지
      const blob=new Blob([html],{type:'text/html;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download='index.html'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
      // 추가한 장표는 이제 파일에 구워졌으므로 스크래치 버퍼 정리 (재로드 시 중복 방지)
      deck.querySelectorAll('.slide[data-custom]').forEach(s=>delete s.dataset.scratch);
      localStorage.removeItem(CUSTOM_KEY);
      alert('수정완료. 편집 내용을 암호화한 index.html을 다운로드했습니다.\n\n🔑 이 파일의 비밀번호: '+pw+(pwChanged?'   ← 새 비밀번호로 변경됨!':'   (기존과 동일)')+'\n\n이 파일을 원하는 곳에 올리면(push/호스팅) 위 비밀번호로만 열립니다.\n소스 보기를 해도 단가/내용은 암호문으로만 보입니다.');
    }catch(err){
      alert('암호화 저장 중 문제가 발생했습니다.\n'+(err&&err.message?err.message:err));
    }finally{
      if(exportBtn){ exportBtn.disabled=false; exportBtn.textContent=prev; }
    }
  }
  document.getElementById('exportBtn').addEventListener('click',exportHTML);

  /* ========== ONE-CLICK PDF DOWNLOAD ========== */
  const pdfBtn=document.getElementById('pdfBtn');
  function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('스크립트 로드 실패: '+src)); document.head.appendChild(s); }); }
  let libsReady=false;
  async function ensureLibs(){
    if(libsReady) return;
    await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');
    await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
    libsReady=true;
  }
  pdfBtn.addEventListener('click',async()=>{
    if(editing) setEditing(false);
    if(document.body.classList.contains('presenting') && typeof exitPresent==='function') exitPresent();
    const orig=pdfBtn.textContent; pdfBtn.disabled=true;
    try{
      pdfBtn.textContent='PDF 준비 중…';
      await ensureLibs();
      const jsPDF=window.jspdf.jsPDF;
      const all=[...document.querySelectorAll('.slide')];
      let pdf=null;
      for(let i=0;i<all.length;i++){
        pdfBtn.textContent='PDF 생성 중 '+(i+1)+'/'+all.length+'…';
        const canvas=await html2canvas(all[i],{
          scale:2, useCORS:true, backgroundColor:null, logging:false,
          width:1600, height:900, windowWidth:1600,
          onclone:(doc)=>{
            doc.querySelectorAll('.slide').forEach(s=>{ s.style.borderRadius='0'; s.style.boxShadow='none'; });
            doc.querySelectorAll('.annot-pin').forEach(e=>e.remove());
            // html2canvas can't render gradient text (background-clip:text) → force a solid fill so glyphs are visible
            const solidFill=(sel,color)=>doc.querySelectorAll(sel).forEach(e=>{
              e.style.background='none'; e.style.backgroundImage='none';
              e.style.webkitBackgroundClip='initial'; e.style.backgroundClip='initial';
              e.style.webkitTextFillColor=color; e.style.color=color;
            });
            solidFill('.s1 h1 .big:last-child, .s-div h1 em, .s14 .left .name, .s15 .left .name, .s16 h2 em', '#e6c46a');
            solidFill('.s3 .row .num, .s4 h2 em, .s14 .right h2 em', '#d2372f');
            solidFill('.pk-silver .left .name', '#a9a9a9');
            solidFill('.pk-bronze .left .name', '#b87333');
            solidFill('.pk-video .left .name', '#d2372f');
            solidFill('.pk-clip .left .name', '#6b6fae');
          }
        });
        const data=canvas.toDataURL('image/jpeg',0.92);
        const w=canvas.width, h=canvas.height;     // page size = exact canvas pixels → zero margin
        if(i===0) pdf=new jsPDF({orientation:'landscape',unit:'px',format:[w,h]});
        else pdf.addPage([w,h],'landscape');
        pdf.addImage(data,'JPEG',0,0,w,h);          // fill the entire page edge-to-edge
      }
      pdf.save('2026_AsianGames_AichiNagoya_NaverPremium.pdf');
    }catch(err){
      alert('PDF 생성 중 문제가 발생했습니다.\n'+(err&&err.message?err.message:err)+'\n\n대안: 키보드 Cmd+P(Mac) / Ctrl+P(Win) → "PDF로 저장"을 사용해 주세요.');
    }finally{
      pdfBtn.disabled=false; pdfBtn.textContent=orig;
    }
  });

  /* ========== SLIDE BUILDER INIT (palette + lock badges + custom slides) ========== */
  const addBtn=document.getElementById('addBtn');
  const palette=document.getElementById('palette');
  if(addBtn) addBtn.addEventListener('click',()=>{ if(editing && palette){ pendingInsertBefore=null; palette.hidden=false; } });
  if(palette){
    palette.querySelectorAll('.palette-item').forEach(b=>{
      b.addEventListener('click',()=>{
        palette.hidden=true;
        const ref=pendingInsertBefore;          // freeze target (multi-insert keeps order before same ref)
        b.dataset.tpl.split(',').forEach(t=>addCustomSlide(t.trim(), ref));
        pendingInsertBefore=null;
      });
    });
    const pc=document.getElementById('paletteCancel'); if(pc) pc.addEventListener('click',()=>palette.hidden=true);
    palette.addEventListener('click',e=>{ if(e.target===palette) palette.hidden=true; });
  }
  // AM mode: stamp a lock badge on every standard slide
  if(amMode){
    deck.querySelectorAll('.slide:not([data-custom])').forEach(s=>{
      if(!s.querySelector(':scope > .lock-badge')){
        const lb=document.createElement('div'); lb.className='lock-badge'; lb.textContent='🔒 표준 장표 — 수정 불가';
        s.appendChild(lb);
      }
    });
  }
  // enhance custom slides already baked into the deck, then restore scratch (unsaved) ones
  deck.querySelectorAll('.slide[data-custom]').forEach(enhanceCustomSlide);
  restoreCustom();
  rebuildHud();
})();

/* ====== Counter animation on KPI numbers ====== */
function getFirstTextNode(el){
  for(const n of el.childNodes){
    if(n.nodeType===Node.TEXT_NODE && n.textContent.trim()) return n;
  }
  return null;
}
function easeOutCubic(t){return 1-Math.pow(1-t,3)}
function animateNumberNode(textNode,raw){
  // Parse target value (handles 1.77, 2,830, 36.1, 191, 46, 1.5, 4,600 etc.)
  const cleaned=raw.replace(/,/g,'');
  const target=parseFloat(cleaned);
  if(isNaN(target)) return;
  const hasComma=/,/.test(raw);
  const decimals=(cleaned.split('.')[1]||'').length;
  const dur=1600;
  const start=performance.now();
  function step(now){
    const t=Math.min(1,(now-start)/dur);
    const v=target*easeOutCubic(t);
    let s=decimals>0?v.toFixed(decimals):Math.round(v).toString();
    if(hasComma){
      const parts=s.split('.');
      parts[0]=parseFloat(parts[0]).toLocaleString('en');
      s=parts.join('.');
    }
    textNode.textContent=s;
    if(t<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
const counterTargets=document.querySelectorAll('.s6 .stat .num, .s2 .right .card .val');
counterTargets.forEach(el=>{
  const tn=getFirstTextNode(el);
  if(!tn) return;
  const raw=tn.textContent.trim();
  if(!/^[\d,.]+$/.test(raw)) return;
  el.dataset.target=raw;
  tn.textContent='0';
});
const counterIO=new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(e.isIntersecting){
      const tn=getFirstTextNode(e.target);
      if(tn && e.target.dataset.target) animateNumberNode(tn,e.target.dataset.target);
      counterIO.unobserve(e.target);
    }
  });
},{threshold:.4});
counterTargets.forEach(el=>counterIO.observe(el));

/* ====== Confetti burst on click (celebration for cover/closing) ====== */
function confettiBurst(x,y){
  const colors=['#d5b200','#d2372f','#4e3a93','#19aea9','#07993F','#FFEC8D'];
  const N=24;
  for(let i=0;i<N;i++){
    const c=document.createElement('div');
    c.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:10px;height:14px;background:${colors[i%colors.length]};border-radius:2px;pointer-events:none;z-index:9999;will-change:transform,opacity`;
    document.body.appendChild(c);
    const ang=(i/N)*Math.PI*2;
    const vel=140+Math.random()*120;
    const dx=Math.cos(ang)*vel;
    const dy=Math.sin(ang)*vel-80;
    c.animate(
      [{transform:'translate(0,0) rotate(0deg)',opacity:1},
       {transform:`translate(${dx}px,${dy+400}px) rotate(${720*Math.random()-360}deg)`,opacity:0}],
      {duration:1200+Math.random()*400,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'}
    ).onfinish=()=>c.remove();
  }
}
document.querySelectorAll('.s1 h1, .s18 h1, .aichi-emblem').forEach(el=>{
  el.style.cursor='pointer';
  el.addEventListener('click',e=>{
    if(document.body.classList.contains('editing'))return; // editing takes priority
    confettiBurst(e.clientX,e.clientY);
  });
});

/* ====== Parallax tilt on cover emblem ====== */
const emblem=document.querySelector('.s1 .emblem-side');
if(emblem){
  const cover=document.querySelector('#s1');
  cover.addEventListener('mousemove',e=>{
    const r=cover.getBoundingClientRect();
    const dx=((e.clientX-r.left)/r.width-.5)*8;
    const dy=((e.clientY-r.top)/r.height-.5)*8;
    emblem.style.transform=`translateY(-50%) translate(${dx}px,${dy}px) rotateY(${dx*.4}deg) rotateX(${-dy*.4}deg)`;
  });
  cover.addEventListener('mouseleave',()=>{emblem.style.transform='translateY(-50%)'});
}
} /* ===== end initDeck ===== */
